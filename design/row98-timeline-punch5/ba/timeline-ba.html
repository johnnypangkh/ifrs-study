<!doctype html>
<html data-theme="dark" lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../../_shared/visuals.css">
<style>
  body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif;width:1280px;padding:var(--space-4);box-sizing:border-box}
  h1{font-size:var(--t1-fs);margin:0 0 var(--space-2)}
  p{font-size:var(--t3-fs);color:var(--muted);margin:0 0 var(--space-3)}
  h2{font-size:var(--t2-fs);margin:var(--space-4) 0 var(--space-2)}
  figure{margin:0 0 var(--space-3)}
  figcaption{font-size:var(--t3-fs);color:var(--muted);margin:0 0 var(--space-1)}
  img{display:block;max-width:100%;height:auto;border:var(--stroke-1) solid var(--line);border-radius:var(--radius-s)}
</style></head><body>
<h1>#98 punch6 — flag on the floor, axis is an arrow</h1>
<p>Before is punch5. After plants each label on a 2px pole on an arrow axis. Same words. No second band.</p>
<h2>Depreciation</h2>
<figure><figcaption>BEFORE · punch5. Plain line. Begins and Ceases hang below it.</figcaption><img src="dep-punch5.png" alt="Dep punch5"></figure>
<figure><figcaption>AFTER · punch6. Arrow axis. Each card stands on a pole planted in its ring. Span「Depreciate over useful life」.</figcaption><img src="dep-timeline-after.png" alt="Dep punch6"></figure>
<h2>Revaluation</h2>
<figure><figcaption>BEFORE · punch5. ◆ on the line, but「Revaluation date」floats above them with no pole.</figcaption><img src="reval-punch5.png" alt="Reval punch5"></figure>
<figure><figcaption>AFTER · punch6. Same ◆ at 35% and 70%. One flag「Revaluation date」, pole on the axis between them. Span「Revalue during useful life」.</figcaption><img src="reval-timeline-after.png" alt="Reval punch6"></figure>
</body></html>
