- action: added
  file: "ias-2/draft-v1-linked/ch03.html"
  locator: "s-3-ex-pwc-212"
  new: "Normal capacity and abnormal costs after a major event or global crisis"
  source: "Accepted REPLACE-126 / CHANGELOG-126 (#126)"
- action: added
  file: "ias-2/draft-v1-linked/ch03.html"
  locator: "s-3-ex-pwc-1910"
  new: "Payments received from suppliers"
  source: "Accepted REPLACE-126 / CHANGELOG-126 (#126)"
- action: added
  file: "ias-2/draft-v1-linked/ch06.html"
  locator: "s-6-5-ifrs18"
  new: "25.49 — two classifications unchanged in outline. The requirement to disclose inventories recognised as an expense can still be met by a nature-of-expense classification or a function-of-expense classification."
  source: "Accepted REPLACE-126 / CHANGELOG-126 (#126)"
- action: added
  file: "ias-2/draft-v1-linked/ch06.html"
  locator: "s-6-ex-pwc-2491"
  new: "25.49.1 — nature presentation with amounts capitalised into inventory. Entities that present operating expenses by nature in the statement of financial performance might present line items that include amounts capitalised into the carrying amount of inventory. Those entities also present a line item for the change in the carrying amount of inventory. Example: total staff costs for the period (including the portion capitalised into inventory) appear as a nature line; a separate “changes in inventory” line includes those capitalised staff costs; the net effect is that only staff costs recognised as an expense for the period enter operating profit."
  source: "Accepted REPLACE-126 / CHANGELOG-126 (#126)"
- action: added
  file: "ias-2/draft-v1-linked/ch06.html"
  locator: "s-6-5-ifrs18"
  new: "25.50 — function / cost of sales. Entities that present operating expenses by function include, within cost of sales, costs previously capitalised in inventories that have been sold in the reporting period (direct and indirect costs and overheads), plus unallocated production overheads and abnormal amounts of production costs; other costs such as distribution may be included in specific circumstances."
  source: "Accepted REPLACE-126 / CHANGELOG-126 (#126)"
- action: added
  file: "ias-2/draft-v1-linked/ch06.html"
  locator: "s-6-5-ifrs18"
  new: "25.51 — write-downs under IFRS 18. A significant NRV write-down may be presented separately in the statement of financial performance or disclosed separately in the notes, depending on useful structured summary / materiality — not only the former IAS 1 face-or-notes rule."
  source: "Accepted REPLACE-126 / CHANGELOG-126 (#126)"
- action: added
  file: "ias-2/draft-v1-linked/ch04.html"
  locator: "s-4-ex-pwc-402"
  new: ": NRV of inventories held to satisfy a particular service contract is based on the contract price."
  source: "Accepted REPLACE-126 / CHANGELOG-126 (#126)"
- action: added
  file: "ias-2/draft-v1-linked/ch03.html"
  locator: "s-3-ex-pwc-331"
  new: "A base-chemicals producer uses liquid feedstock that is either ‘green’/sustainable or ‘grey’/non-sustainable. Both share the same physical features and are stored in the same tanks; only the green characteristics differ."
  source: "Accepted REPLACE-126 / CHANGELOG-126 (#126)"
- action: added
  file: "ias-2/draft-v1-linked/ch03.html"
  locator: "s-3-ex-pwc-199"
  new: "A large retailer buys finished goods from a manufacturer and sells them to end consumers in retail stores."
  source: "Accepted REPLACE-126 / CHANGELOG-126 (#126)"
- action: added
  file: "ias-2/draft-v1-linked/ch03.html"
  locator: "s-3-ex-pwc-198"
  new: "A retailer buys goods for resale at C100 per unit and receives volume rebates from the manufacturer for calendar-year purchases (1 January–31 December)."
  source: "Accepted REPLACE-126 / CHANGELOG-126 (#126)"
- action: added
  file: "ias-2/draft-v1-linked/ch04.html"
  locator: "s-4-ex-pwc-402"
  new: "A shipping entity transports goods for customers. At the year end it holds fuel inventory with carrying amount C1 million (C800 per unit)."
  source: "Accepted REPLACE-126 / CHANGELOG-126 (#126)"
- action: added
  file: "ias-2/draft-v1-linked/ch03.html"
  locator: "s-3-ex-pwc-212"
  new: "Abnormal wastage. Assess the nature of new costs, the territory, and peer practice. Consider whether selling prices have been revised to absorb the extra costs on new contracts."
  source: "Accepted REPLACE-126 / CHANGELOG-126 (#126)"
- action: added
  file: "ias-2/draft-v1-linked/ch03.html"
  locator: "s-3-ex-pwc-331"
  new: "Account separately for the difference between grey and green (the green premium)."
  source: "Accepted REPLACE-126 / CHANGELOG-126 (#126)"
- action: added
  file: "ias-2/draft-v1-linked/ch03.html"
  locator: "s-3-ex-pwc-212-illus"
  new: "Additional labour that meets may be capitalised; the fixed-overhead rate may be revised for the reduced allowable capacity (higher fixed cost in inventory). Assess NRV if selling prices have not yet moved."
  source: "Accepted REPLACE-126 / CHANGELOG-126 (#126)"
- action: added
  file: "ias-2/draft-v1-linked/ch03.html"
  locator: "s-3-ex-pwc-1910"
  new: "Adjustment to the cost of inventories purchased from the supplier"
  source: "Accepted REPLACE-126 / CHANGELOG-126 (#126)"
- action: added
  file: "ias-2/draft-v1-linked/ch03.html"
  locator: "s-3-ex-pwc-198"
  new: "Annual reporting date is 31 March. From 1 January to 31 March 20X0 the retailer bought 200,000 units; it expects a further 400,000 units from 1 April to 31 December 20X0 (total year estimate 600,000)."
  source: "Accepted REPLACE-126 / CHANGELOG-126 (#126)"
- action: added
  file: "ias-2/draft-v1-linked/ch03.html"
  locator: "s-3-ex-pwc-198"
  new: "Asset recognition elsewhere in IFRS uses expected cash flows (weighted-average or expected-outcome). Apply that approach to estimate inventory cost."
  source: "Accepted REPLACE-126 / CHANGELOG-126 (#126)"
- action: added
  file: "ias-2/draft-v1-linked/ch03.html"
  locator: "s-3-ex-pwc-1910"
  new: "Attributing variable or unattached fixed amounts. Variable volume rebates: see Illustration 3.2.11 (FAQ 25.19.8). For fixed amounts not linked to specific purchases, attribute by substance — period of activity, periodic receipt pattern, minimum-purchase / term commitments, and commercial rationale. Use a method that yields a reasonable estimate of cost; straight-line over a period can be practical, but heavy discounting and abnormally high margins in a launch window may show the attribution is wrong."
  source: "Accepted REPLACE-126 / CHANGELOG-126 (#126)"
- action: added
  file: "ias-2/draft-v1-linked/ch04.html"
  locator: "s-4-ex-pwc-402"
  new: "Consider negotiations or historical evidence of contracts, given current market conditions, to judge whether the inventory will be used in a profitable contract."
  source: "Accepted REPLACE-126 / CHANGELOG-126 (#126)"
- action: added
  file: "ias-2/draft-v1-linked/ch03.html"
  locator: "s-3-ex-pwc-199"
  new: "Costs of moving inventories from one point of sale to another (for example between stores) are generally not included — the goods were already in a condition and location for sale before the move."
  source: "Accepted REPLACE-126 / CHANGELOG-126 (#126)"
- action: added
  file: "ias-2/draft-v1-linked/ch03.html"
  locator: "s-3-ex-pwc-199"
  new: "Costs to transport goods from the manufacturer to the retail store can reasonably be included — the transport is essential to put the goods on sale at that location in an appropriate condition."
  source: "Accepted REPLACE-126 / CHANGELOG-126 (#126)"
- action: added
  file: "ias-2/draft-v1-linked/ch03.html"
  locator: "s-3-ex-pwc-212-illus"
  new: "Demand falls sharply; B expects 50% capacity for 12 months then full capacity. Peers act similarly. Fixed overheads cannot be cut; selling prices cannot be raised."
  source: "Accepted REPLACE-126 / CHANGELOG-126 (#126)"
- action: added
  file: "ias-2/draft-v1-linked/ch03.html"
  locator: "s-3-ex-pwc-212-illus"
  new: "Drought lowers river levels so ships load to one-third capacity — delayed deliveries, higher transport costs, production losses. Fixed overheads and selling prices cannot absorb the temporary shock."
  source: "Accepted REPLACE-126 / CHANGELOG-126 (#126)"
- action: added
  file: "ias-2/draft-v1-linked/ch06.html"
  locator: "s-6-5-ifrs18"
  new: "Effective date. Amendments apply for annual periods beginning on or after 1 January 2027 when the entity applies IFRS 18. Earlier application together with IFRS 18 is permitted (disclose that fact). Until then, the pre-amendment IAS 1 / IAS 2 presentation text continues to apply."
  source: "Accepted REPLACE-126 / CHANGELOG-126 (#126)"
- action: added
  file: "ias-2/draft-v1-linked/ch03.html"
  locator: "s-3-ex-pwc-212-illus"
  new: "Fixed overhead per unit is not increased for low production; unallocated overheads are expensed (see Illustration 3.3.3)."
  source: "Accepted REPLACE-126 / CHANGELOG-126 (#126)"
- action: added
  file: "ias-2/draft-v1-linked/ch03.html"
  locator: "s-3-ex-pwc-1910"
  new: "Forms of payment. Retailers and similar entities often receive supplier payments designed to support a lower resale price, to reduce selling cost, or to increase advertising of the supplier’s products. Example fact pattern: the entity agrees to buy goods and, at or near the same time, the supplier agrees to pay CU1 million as a contribution to marketing related to those products."
  source: "Accepted REPLACE-126 / CHANGELOG-126 (#126)"
- action: added
  file: "ias-2/draft-v1-linked/ch03.html"
  locator: "s-3-ex-pwc-212"
  new: "Framework. Governments or regulators may restrict operations. Entities may run at lower revised capacity or incur extra costs. Fixed production overheads are allocated on normal capacity ( ); abnormal wastage is expensed when incurred ( ). IAS 2 does not list factors for a ‘new normal’ capacity or for abnormal costs."
  source: "Accepted REPLACE-126 / CHANGELOG-126 (#126)"
- action: added
  file: "ias-2/draft-v1-linked/ch03.html"
  locator: "s-3-ex-pwc-331"
  new: "Green feedstock costs significantly more (grey price plus a green premium)."
  source: "Accepted REPLACE-126 / CHANGELOG-126 (#126)"
- action: added
  file: "ias-2/draft-v1-linked/ch03.html"
  locator: "s-3-ex-pwc-198"
  new: "IAS 2 does not give specific guidance on variable rebates. The right to rebate cash flows is contingent on future purchases, so it is not a financial asset."
  source: "Accepted REPLACE-126 / CHANGELOG-126 (#126)"
- action: added
  file: "ias-2/draft-v1-linked/ch03.html"
  locator: "s-3-ex-pwc-198"
  new: "If the rebate estimate is a significant judgement, disclose under [ ] in addition to estimate disclosures under [ ]."
  source: "Accepted REPLACE-126 / CHANGELOG-126 (#126)"
- action: added
  file: "ias-2/draft-v1-linked/ch03.html"
  locator: "s-3-ex-pwc-199"
  new: "In limited cases, short intermediate storage that is an unavoidable part of the supply chain to the present location may be capitalised."
  source: "Accepted REPLACE-126 / CHANGELOG-126 (#126)"
- action: added
  file: "ias-2/draft-v1-linked/ch03.html"
  locator: "s-3-ex-pwc-1910"
  new: "Income for a distinct good or service the entity provides to the supplier"
  source: "Accepted REPLACE-126 / CHANGELOG-126 (#126)"
- action: added
  file: "ias-2/draft-v1-linked/ch03.html"
  locator: "s-3-ex-pwc-199"
  new: "It operates a distribution network that requires both transportation and storage."
  source: "Accepted REPLACE-126 / CHANGELOG-126 (#126)"
- action: added
  file: "ias-2/draft-v1-linked/ch03.html"
  locator: "s-3-ex-pwc-199"
  new: "Judgement is needed in a complex supply chain or multi-channel network. Where expenses are analysed by function, includes in cost of sales the costs previously in inventory that has been sold, unallocated production overheads and abnormal production costs."
  source: "Accepted REPLACE-126 / CHANGELOG-126 (#126)"
- action: added
  file: "ias-2/draft-v1-linked/ch04.html"
  locator: "s-4-ex-pwc-402"
  new: "Key: intended use through provision of the service where an ultimate profit is expected. If the end-service price is not observable, estimate using the best available information, including current market conditions."
  source: "Accepted REPLACE-126 / CHANGELOG-126 (#126)"
- action: added
  file: "ias-2/draft-v1-linked/ch03.html"
  locator: "s-3-ex-pwc-331"
  new: "Labelling-rights stock and physical feedstock stock are unrelated: green feedstock used in grey products in one period still supports later green labelling."
  source: "Accepted REPLACE-126 / CHANGELOG-126 (#126)"
- action: added
  file: "ias-2/draft-v1-linked/ch03.html"
  locator: "s-3-ex-pwc-212-illus"
  new: "Later, stricter environmental rules permanently restrict river shipping; materials move by truck at higher cost. Those higher transport costs enter raw-material cost ( ). Assess whether finished goods will sell at or above cost; otherwise write materials down to NRV ( )."
  source: "Accepted REPLACE-126 / CHANGELOG-126 (#126)"
- action: added
  file: "ias-2/draft-v1-linked/ch03.html"
  locator: "s-3-ex-pwc-212-illus"
  new: "Local measures require extra labour for health and safety checks and force lower factory capacity for distancing. Demand is unchanged and the lower capacity cannot meet demand."
  source: "Accepted REPLACE-126 / CHANGELOG-126 (#126)"
- action: added
  file: "ias-2/draft-v1-linked/ch03.html"
  locator: "s-3-ex-pwc-331"
  new: "Measure the indistinguishable physical feedstock under IAS 2 (cost formulas for interchangeable items apply)."
  source: "Accepted REPLACE-126 / CHANGELOG-126 (#126)"
- action: added
  file: "ias-2/draft-v1-linked/ch03.html"
  locator: "s-3-ex-pwc-212-illus"
  new: "Normal capacity and the long-term operating plan have not changed. Peer cutbacks from demand do not rewrite normal capacity."
  source: "Accepted REPLACE-126 / CHANGELOG-126 (#126)"
- action: added
  file: "ias-2/draft-v1-linked/ch03.html"
  locator: "s-3-ex-pwc-212"
  new: "Normal capacity. Normal capacity is production expected on average over a number of periods or seasons under normal circumstances, taking planned maintenance into account. Reductions in production from reduced demand should not affect normal capacity. Many automated facilities face limited production constraints in a crisis — changing normal capacity is a high hurdle. Disclose significant judgements under IAS 1 [IAS 8]; consider IAS 36 indicators if assets become idle or operations are restructured."
  source: "Accepted REPLACE-126 / CHANGELOG-126 (#126)"
- action: added
  file: "ias-2/draft-v1-linked/ch03.html"
  locator: "s-3-ex-pwc-1910"
  new: "Out of scope of this FAQ. Payments the supplier makes on behalf of the entity’s end customer (for example coupons redeemed by the entity from the supplier) are not addressed here."
  source: "Accepted REPLACE-126 / CHANGELOG-126 (#126)"
- action: added
  file: "ias-2/draft-v1-linked/ch03.html"
  locator: "s-3-ex-pwc-212-illus"
  new: "Peers face the same restrictions. Long-term budgets plan to pass much of the incremental cost to customers."
  source: "Accepted REPLACE-126 / CHANGELOG-126 (#126)"
- action: added
  file: "ias-2/draft-v1-linked/ch04.html"
  locator: "s-4-ex-pwc-341"
  new: "PwC — estimated costs necessary to make the sale (IFRS IC June 2021). The agenda decision observed that NRV is selling price less costs of completion and costs necessary to make the sale ( ), and that the write-down objective is to avoid carrying inventories above amounts expected to be realised from sale ( ). The requirement does not allow limiting those costs to incremental costs alone if other non-incremental costs are necessary to make the sale. The entity judges which costs are necessary in its ordinary course of business, given its facts and the nature of the inventories. In some cases IFRS 15 para 92 incremental costs (for example sales commissions) may be all that is necessary; in others broader costs apply (for example a bespoke direct marketing campaign for an identified product line). Significant judgement → disclose under [ ]."
  source: "Accepted REPLACE-126 / CHANGELOG-126 (#126)"
