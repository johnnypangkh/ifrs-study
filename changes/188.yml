  file: "ias-2/draft-v1-linked/ch03.html"
  locator: "s-3-ex-pwc-1910"
  new: "Step 1 — distinct good or service? If the supplier receives a distinct good or service from the entity, recognise income when control transfers (the supplier is the customer). IFRS 15’s distinctness guidance is the reference frame. Marketing contributions (co-advertising, slotting, placement) are often hard to treat as distinct: they are usually negotiated with inventory purchases, affect the product’s sales price, may be only loosely specified, and often can be delivered only by the retailer while selling the products — benefiting both parties. Payments that vary solely with the volume of the entity’s own purchases are unlikely to be for a distinct service. If the amount exceeds the FV of any distinct goods/services, assess the excess as reimbursement or inventory-cost reduction. Present distinct-service receipts as income (revenue or other income); do not offset against expenses. If classified as revenue, related expenses (for example marketing) go to cost of sales."
  source: "Accepted REPLACE-126 / CHANGELOG-126 (#126)"
- action: added
  file: "ias-2/draft-v1-linked/ch03.html"
  locator: "s-3-ex-pwc-1910"
  new: "Step 2 — genuine and specific cost reimbursement? If not distinct, net against costs only when a genuine specific cost is reimbursed. The IFRS Interpretations Committee confirmed cash discounts are deducted from inventory cost unless rebates specifically and genuinely refund selling expenses — that is the reimbursement test. Indicators include a requirement to incur specific costs and variability with those expenses. Fixed amounts are hard to prove as reimbursement when expenses vary; amounts greater than the expenses indicate the payment is not a reimbursement. Offset against the reimbursed expense line (not cost of sales unless that expense sits in cost of sales)."
  source: "Accepted REPLACE-126 / CHANGELOG-126 (#126)"
- action: added
  file: "ias-2/draft-v1-linked/ch03.html"
  locator: "s-3-ex-pwc-1910"
  new: "Step 3 — reduction of inventory cost. Otherwise apply : trade discounts, rebates and similar items are deducted in determining purchase cost. Receipts from suppliers, though not listed, are treated the same when they are part of the supply arrangement. Allocate to inventory and recognise as a reduction of cost of sales when sold; defer amounts that relate to future purchases until those purchases occur."
  source: "Accepted REPLACE-126 / CHANGELOG-126 (#126)"
