  file: "ifrs-18/draft-v1-linked/ch03.html"
  locator: "s-3-pwc-faq-18502"
  new: "Because holding and managing those investments and distributing the related returns is the parent's only substantive activity, that fact is, in itself, sufficient evidence that investing in unconsolidated subsidiaries is a ‘main’ business activity for the purposes of the parent’s separate financial statements."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
