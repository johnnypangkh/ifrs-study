  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch02.html"
  locator: "s-2-pwc-faq-18382"
  new: "However, this paragraph must be read in conjunction with paragraph 24 of IFRS 18."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch06.html"
  locator: "s-6-pwc-ex-181852"
  new: "However, this presumption can be rebutted."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch02.html"
  locator: "s-2-pwc-faq-18331"
  new: "However, where an entity determines that separate presentation of the material required line item is not necessary for the primary statement to provide a useful structured summary, the material required line item would be disclosed in the notes."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch03.html"
  locator: "s-3-pwc-faq-18864"
  new: "However, whether a derivative is used to manage identified risks is a matter of fact and not purely an assertion for accounting purposes."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch05.html"
  locator: "s-5-pwc-faq-18941"
  new: "IFRS 15 specifically states that an entity should present the effects of financing (interest revenue or interest expense) separately from revenue from contracts with customers in the statement of comprehensive income."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch03.html"
  locator: "s-3-pwc-faq-18605"
  new: "IFRS 18 addresses the presentation of income and expenses from cash and cash equivalents depending on an entity’s business activity."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch06.html"
  locator: "s-6-pwc-faq-181893"
  new: "IFRS 18 does not contemplate any specific format for entities to provide the reconciliation in paragraph 123(c) of IFRS 18, except that the disclosure should be in a single note."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch05.html"
  locator: "s-5-pwc-faq-18992"
  new: "IFRS 18 does not define what a ‘function’ is."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch03.html"
  locator: "s-3-pwc-faq-18584"
  new: "IFRS 18 does not define what constitutes ‘shared characteristics’ when assessing whether an entity invests in assets that generate returns individually and largely independently of its other resources."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch02.html"
  locator: "s-2-pwc-faq-18311"
  new: "IFRS 18 does not define ‘structured summaries’."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch02.html"
  locator: "s-2-pwc-ex-18381"
  new: "IFRS 18 does not prescribe a step by step process to apply the principles of aggregation and disaggregation."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch06.html"
  locator: "s-6-pwc-faq-181891"
  new: "IFRS 18 does not prohibit an MPM from being presented on the face of the statement of financial performance."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch06.html"
  locator: "s-6-pwc-faq-181751"
  new: "IFRS 18 does not provide any further indication of what ‘specifically required to be presented or disclosed’ means, but the guidance in paragraphs B114-B115 and B133 of IFRS 18 App B indicates that reportable segment information could meet the definition of an MPM where it provides information about an aspect of performance of the entity as a whole."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch03.html"
  locator: "s-3-pwc-faq-18865"
  new: "IFRS 18 does not provide any guidance on, or a definition of, a ‘component’ of a hedging instrument."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch03.html"
  locator: "s-3-pwc-faq-18865"
  new: "IFRS 18 does not provide any guidance on, or a definition of, a ‘component’ of a hedging instrument. An entity should determine whether an undesignated proportion of a derivative should be treated as: an undesignated ‘component’ – that is, the gains or losses should be classified in the same category as the gains or losses on the proportion of 3.10.38 — How should an entity classify the gains or losses on a derivative that is… How should an entity classify the gains or losses on a derivative that is…. UR/receive USD forward to manage both the USD FX risk on the principal amount of the borrowing and the EUR FX risk on the principal amount of the bond."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch03.html"
  locator: "s-3-pwc-faq-18605"
  new: "IFRS 18 does not specifically address the presentation of income and expenses from such fluctuating bank accounts. [IAS 7 para 8]."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch03.html"
  locator: "s-3-pwc-faq-18601"
  new: "IFRS 18 does not specify the location of the line item for income and expenses from equity-accounted investments in the investing category in the statement of profit or loss."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch03.html"
  locator: "s-3-pwc-faq-18585"
  new: "IFRS 18 does not specify which assets form part of an entity’s specified main business activity of investing in assets, nor does it prescribe how an entity should make this determination."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch03.html"
  locator: "s-3-pwc-ex-18491"
  new: "IFRS 18 has introduced the concept of ‘main business activity’ so that the results of these activities are reported as part of an entity’s operating profit."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch06.html"
  locator: "s-6-pwc-ex-181852"
  new: "IFRS 18 includes a presumption that any subtotal of income and expenses included in public communications outside the financial statements communicates management’s view of an aspect of the financial performance of the entity as a whole."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch06.html"
  locator: "s-6-pwc-ex-181851"
  new: "IFRS 18 includes a rebuttable presumption stating that if an entity uses a subtotal of income and expenses in its public communications outside the financial statements, this measure communicates management’s view of an aspect of the financial performance of the entity."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch06.html"
  locator: "s-6-pwc-faq-181893"
  new: "IFRS 18 includes an illustrative example (see IE 8) and FAQ 18.190.1 also provides an example of how a reconciliation might look."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch03.html"
  locator: "s-3-pwc-faq-18864"
  new: "IFRS 18 neither defines, nor provides guidance regarding, the meaning of ‘used to manage identified risks’."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch02.html"
  locator: "s-2-pwc-ex-18401"
  new: "IFRS 18 provides examples of line items that might have sufficiently dissimilar characteristics to warrant separate presentation in the primary financial statements or disclosure in the notes: Income and expenses: a. write-downs of inventories, as well as reversals of such write-downs; b. impairment losses for property, plant and equipment, as well as reversals of such impairment losses; c. income and expenses from restructurings of an entity’s activities and reversals of any provisions for restructuring; d. income and expenses from disposals of property, plant and equipment; e. income and expenses from disposals of investments; f. income and expenses from litigation settlements; g. reversals of provisions; and h. non-recurring income and expenses not included in (a)–(g)."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch05.html"
  locator: "s-5-pwc-faq-181001"
  new: "IFRS 18 requires a qualitative explanation to be provided, although an entity could also provide a quantitative explanation."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch07.html"
  locator: "s-7-pwc-faq-181451"
  new: "IFRS 18 requires classification as a current liability if there is an actual breach at the reporting date, but not if there is only a potential breach."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch06.html"
  locator: "s-6-pwc-ex-181852"
  new: "IFRS 18 requires income-tax-effect and NCI disclosures for MPM reconciliations even when the MPM itself is a pre-tax measure."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch06.html"
  locator: "s-6-pwc-ex-181902"
  new: "IFRS 18 requires income-tax-effect and NCI disclosures for MPM reconciliations even when the MPM itself is a pre-tax measure."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch05.html"
  locator: "s-5-pwc-ex-18991"
  new: "IFRS 18 sets out an example of a manufacturer that has determined that the main component or driver of profitability might be cost of sales, which also provides relevant margins to management."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch05.html"
  locator: "s-5-pwc-ex-18991"
  new: "IFRS 18 sets out an example of a manufacturer that has determined that the main component or driver of profitability might be cost of sales, which also provides relevant margins to management. The entity determined that presenting in the operating category of the statement of profit or loss expenses classified by their function provides the most useful structured summary of expenses: Revenue from the sale of goods X Cost of goods sold X Gross profit X Research and development expenses X General and administrative expenses X Operating profit X A qualitative description of the nature of expenses should be disclosed for each function line item."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch05.html"
  locator: "s-5-pwc-ex-18981"
  new: "IFRS 18 sets out an example of a manufacturer that has determined that the main drivers of profitability are costs for raw materials and employment and therefore presenting operating expenses by nature provides the most useful structured summary."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch05.html"
  locator: "s-5-pwc-ex-18981"
  new: "IFRS 18 sets out an example of a manufacturer that has determined that the main drivers of profitability are costs for raw materials and employment and therefore presenting operating expenses by nature provides the most useful structured summary. The table below illustrates the financial statement line items that the entity might present in the operating category: Revenue X Changes in inventories of finished goods and work in progress X Raw materials used X Employee benefits X Depreciation X Amortisation X Impairment losses on property, plant, and equipment X Impairment losses on trade receivables X Property taxes X Litigation expenses X Losses (gains) on derivatives X Other operating expenses X Operating profit X."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch05.html"
  locator: "s-5-pwc-faq-18992"
  new: "IFRS 18 sets out an example that states that ‘cost of sales’ is a function line item that combines expenses relating to an entity’s production or other revenue-generating activities, such as raw materials, employee benefit expense, depreciation and amortisation."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch06.html"
  locator: "s-6-pwc-ex-181911"
  new: "IFRS 18 sets out three approaches available to calculate the tax impact of reconciling items: a. at the statutory tax rate(s) applicable to the transaction(s) in the tax jurisdiction(s) concerned; b. based on a reasonable pro rata allocation of the current and deferred tax of the entity in the tax jurisdiction(s) concerned; or c. by using another method that achieves a more appropriate allocation in the circumstances."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch07.html"
  locator: "s-7-pwc-faq-181321"
  new: "IFRS 18 states that a mixed presentation might be appropriate in certain circumstances but deferred tax assets and liabilities arise in the financial statements of most entities."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch03.html"
  locator: "s-3-pwc-faq-18451"
  new: "IFRS 18 uses the concept of categories to classify the income and expenses included in the statement of profit or loss."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch03.html"
  locator: "s-3-pwc-faq-18631"
  new: "If a liability is recognised, classification of the income and expenses will depend on the nature of the liability recognised."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch06.html"
  locator: "s-6-pwc-faq-181801"
  new: "If a private entity includes a subtotal of income and expenses in its public communication that meets the definition of an MPM, all of the MPMs disclosure requirements would apply."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch03.html"
  locator: "s-3-pwc-faq-18782"
  new: "If a separate presentation does not achieve a useful structured summary, the gain or loss would be aggregated with other items in the same category with similar characteristics (see para 18.40). b."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch02.html"
  locator: "s-2-pwc-faq-18361"
  new: "If adopted, such a presentation might look something like the following (in the example below, for illustrative purposes and to achieve a consistent presentation, a similar presentation is used for both interest revenue and interest expense): Interest revenue (calculated using the effective interest method on assets at amortised cost and X FVOCI) Other similar income 1 (method of calculation, and on which assets, to be explained in the X notes) Interest expense (calculated using the effective interest method on liabilities at amortised cost) (X) Other similar expenses (method of calculation, and on which liabilities, to be explained in the (X) notes) Net interest margin X 1 This might have other labels, such as ‘other interest income’."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch02.html"
  locator: "s-2-pwc-ex-18411"
  new: "If aggregated items ‘Other operating expenses’ line item do not share similar on the statement of profit or loss characteristics, consisting of: describe them in a way that represents the dissimilar legal fees; characteristics. staff entertainment; outsourced cleaning service for office; and rental income on ancillary assets all of which are individually not material."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch06.html"
  locator: "s-6-pwc-ex-181802"
  new: "If an entity communicates a measure to some but not all users (for example, to a bank to demonstrate compliance with a loan covenant), or if a private equity portfolio company communicates a measure to the private equity company, this will not be considered as public communication."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch03.html"
  locator: "s-3-pwc-faq-18601"
  new: "If considered necessary to provide a useful structured summary (see para 18.31), an entity could present the line item as the first item below operating profit, and it could present an additional subtotal for ‘operating profit and the income and expenses from investments accounted for applying the equity method’."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch03.html"
  locator: "s-3-pwc-faq-18812"
  new: "If determining that category would involve undue cost or effort, the foreign exchange difference should be classified in the operating category."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch03.html"
  locator: "s-3-pwc-ex-18869"
  new: "If doing so would require the grossing up of gains or losses (see para B74 of IFRS 18), or would involve undue cost or effort, the gains or losses are instead classified in the operating category."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch06.html"
  locator: "s-6-pwc-ex-181911"
  new: "If entity A identified a different approach, this can be used, but it should demonstrate that this gives more appropriate information for users."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch03.html"
  locator: "s-3-pwc-faq-18882"
  new: "If income and expenses from the item being managed are required to be presented in a line item in accordance with paragraph 75 of IFRS 18 (such as revenue), this requires an additional assessment of whether separate presentation of the required line item is necessary for the statement of profit or loss to provide a useful structured summary (see FAQ 18.33.1)."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch05.html"
  locator: "s-5-pwc-faq-18941"
  new: "If interest income is incidental and not presented as revenue, it could be presented separately or aggregated with other items with similar characteristics (see para 8.40)."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch03.html"
  locator: "s-3-pwc-faq-18631"
  new: "If no liability is recognised, such as in some stock lending transactions, then the requirements relating to classification in the financing category are not applicable."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch07.html"
  locator: "s-7-pwc-ex-181343"
  new: "If not clearly identifiable, an entity’s normal operating cycle is assumed to be 12 months. [IFRS 18 para 101(a)]. [IFRS 18 para B96]."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch03.html"
  locator: "s-3-pwc-faq-18761"
  new: "If not separately presented, and the gain is material, it should be disclosed in the notes (see para 18.32)."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch05.html"
  locator: "s-5-pwc-faq-18941"
  new: "If separate presentation is not necessary for a useful structured summary, the interest income should be separately disclosed in the notes (if material)."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch07.html"
  locator: "s-7-pwc-faq-181282"
  new: "If so, the instrument is, in substance, long-term in nature, and the parent classifies it as a non-current asset."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch02.html"
  locator: "s-2-pwc-faq-18361"
  new: "If such a presentation is adopted, each component is required to be appropriately presented and labelled in accordance with paragraphs 24 and 43 of IFRS 18."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch03.html"
  locator: "s-3-pwc-faq-18631"
  new: "If the above transaction results in the recognition of a: a. derivative or a separated embedded derivative: the requirements in paragraphs 18.85-18.88 should be applied. b. hybrid liability (financial or non-financial), which is the combination of a host liability contract and either a separated or not separated embedded derivative: the requirements in paragraphs 18.68-18.69 should be applied. c."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch05.html"
  locator: "s-5-pwc-faq-181001"
  new: "If the amounts disclosed include amounts that have been recognised as part of the carrying amount of an asset (that is, the amount disclosed includes both amounts recognised as an expense and amounts capitalised to assets), the entity should provide a qualitative explanation of that fact, identifying the asset involved."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch07.html"
  locator: "s-7-pwc-ex-181343"
  new: "If the borrower has discretion to repay the loan before the contractual due date (for example, a borrower’s call option), those features do not affect classification of the loan, regardless of when the right is exercisable or the borrower’s intention to exercise."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch07.html"
  locator: "s-7-pwc-faq-181361"
  new: "If the conversion option satisfies the ‘fixed for fixed’ criteria, the liability component of the convertible debt should be classified as non-current."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch05.html"
  locator: "s-5-pwc-faq-18941"
  new: "If the entity aggregates interest revenue with revenue from contracts with customers, it would not be appropriate to label the line item ‘Revenue from contracts with customers’."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch03.html"
  locator: "s-3-pwc-faq-18821"
  new: "If the entity considers that the decision to purchase consumables was an operational decision, the entity might classify all of the foreign exchange differences relating to the trade payable in the operating category."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch07.html"
  locator: "s-7-pwc-faq-181344"
  new: "If the entity does not have discretion over the contingency (for example, if the counterparty has discretion or neither party has discretion), further judgement might need to be applied to determine the appropriate classification depending on the facts and circumstances."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch03.html"
  locator: "s-3-pwc-faq-18868"
  new: "If the entity repays the borrowing early, the hedged future cash flows are no longer expected to occur."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch03.html"
  locator: "s-3-pwc-ex-18869"
  new: "If the group's risk management policy was instead to use the external derivative to manage the foreign currency risk of both the asset and the liability on a gross basis, these risks would affect line items in the investing category and in the financing category of the consolidated statement of profit or loss."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch07.html"
  locator: "s-7-pwc-faq-181344"
  new: "If the liability with a contingent settlement condition is not a loan, or the contingent settlement condition is not a covenant, the general classification guidance in paragraph 101(d) of IFRS 18 should be applied."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch06.html"
  locator: "s-6-pwc-ex-181901"
  new: "If the most directly comparable IFRS-defined subtotal is not presented in the statement of profit or loss, a two-step reconciliation is performed: 1. reconcile the MPM and the most directly comparable IFRS-defined subtotal; and 2. reconcile the most directly comparable IFRS-defined subtotal to which the MPM is reconciled and the total or subtotal presented in the statement of financial performance that is most directly comparable to that."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch06.html"
  locator: "s-6-pwc-faq-181893"
  new: "If the relevant regulator requires a prescribed format, this should be considered."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
