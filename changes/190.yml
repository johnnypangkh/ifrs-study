  file: "ifrs-18/draft-v1-linked/ch03.html"
  locator: "s-3-pwc-ex-18582"
  new: "Both criteria need to be met for an asset to generate a return individually and largely independently of other resources."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch07.html"
  locator: "s-7-pwc-faq-181282"
  new: "Both parties might expect and intend that the loan will remain outstanding for the foreseeable future."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch03.html"
  locator: "s-3-pwc-faq-18512"
  new: "By applying similar reasoning to the IFRS Interpretations Committee's April 2026 Agenda Decision (see FAQ 18.50.2), in a case where the entity is actively raising external finance and substantively lending it onwards to others, that activity would constitute a specified main business activity of providing financing to customers in the entity's separate financial statements, and the entity would classify the related income and expenses in the operating category."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
