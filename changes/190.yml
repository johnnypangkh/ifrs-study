  file: "ifrs-18/draft-v1-linked/ch07.html"
  locator: "s-7-pwc-faq-181481"
  new: "Because of this, the bank does not have an enforceable right to require repayment within the next 12 months at the end of December."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch03.html"
  locator: "s-3-pwc-faq-18512"
  new: "Because operating as the group’s corporate treasury is a substantive activity and the entity does not have any other activity, that fact is, in itself, sufficient evidence that providing financing to ‘customers’ is a ‘main’ business activity for the purposes of the entity’s separate financial statements."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch07.html"
  locator: "s-7-pwc-faq-181455"
  new: "Because the entity has a right (in the form of the rollover) to defer settlement for longer than 12 months after the reporting date, the entity needs to consider whether there are covenants related to that right."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch07.html"
  locator: "s-7-pwc-faq-181442"
  new: "Because this relates to a loan with a contingent settlement condition that is not a covenant, an acceptable treatment would be to classify the estimated repayments to be made in the 12 months after the end of the reporting period as a current liability."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
