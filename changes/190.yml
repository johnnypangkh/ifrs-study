  file: "ifrs-18/draft-v1-linked/ch03.html"
  locator: "s-3-pwc-faq-18461"
  new: "No. Although there was some discussion by the IASB on whether the categories used in each of the primary financial statements should be aligned, the IASB decided to focus the definition of categories for the statement of profit or loss on the information needs of users for this specific statement. Consequently, the description of the categories in IFRS 18 is not aligned with those in the cash flow statement. For example, cash flows related to capital costs for assets used to support operations are reported within the investing category in the cash flow statement, while the related income and expenses (depreciation or amortisation) will be reported within the operating category in the statement of profit or loss."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
