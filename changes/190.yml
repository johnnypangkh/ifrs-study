  file: "ifrs-18/draft-v1-linked/ch03.html"
  locator: "s-3-pwc-faq-18931"
  new: "An entity might recognise gains and losses related to the disposal of a business in financial reporting periods after the initial gain or loss on disposal was recognised."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch03.html"
  locator: "s-3-pwc-faq-18868"
  new: "An entity might use an interest rate swap to hedge the variability in interest cash flows of a variable-rate borrowing, and apply cash flow hedge accounting in accordance with IFRS 9."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch02.html"
  locator: "s-2-pwc-faq-18422"
  new: "An entity might use assets, including right of use assets, to perform remediation activities."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch05.html"
  locator: "s-5-pwc-faq-18971"
  new: "An entity needs to consider what characteristic results in line items in the operating category that provide the most useful structured summary."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch07.html"
  locator: "s-7-pwc-faq-181631"
  new: "An entity presents the following transactions with owners (in their capacity as owners) in the statement of changes in equity: Share issues and redemptions."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch03.html"
  locator: "s-3-pwc-faq-18644"
  new: "An entity should apply the accounting policy consistently to all similar NCI puts issued as part of business combinations."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch03.html"
  locator: "s-3-pwc-faq-18865"
  new: "An entity should determine whether an undesignated proportion of a derivative should be treated as: an undesignated ‘component’ – that is, the gains or losses should be classified in the same category as the gains or losses on the proportion of the derivative designated in the hedge relationship; or a separate derivative not used to manage identified risks – that is, the gains or losses should be classified in the operating category (unless the derivative relates to a transaction that involves only the raising of finance; see para 18.87)."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch03.html"
  locator: "s-3-pwc-faq-18812"
  new: "An entity should develop and apply an accounting policy (that is, one of the ways described above) to similar transactions in accordance with IAS 8."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch05.html"
  locator: "s-5-pwc-faq-181021"
  new: "An entity that classifies its expenses by function and that has operating expenses that are difficult to allocate to functions in a non-arbitrary way, such as a substantive impairment of goodwill which does not clearly support a single activity or process."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch03.html"
  locator: "s-3-pwc-faq-18762"
  new: "An entity that provides financing to customers as a main business activity classifies income and expenses arising on the liability to the factor consistent with its accounting policy for liabilities that arise from transactions involving only the raising of finance but do not relate to providing financing to customers (see para 18.64)."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch03.html"
  locator: "s-3-pwc-faq-18644"
  new: "An entity that provides financing to customers as a main business activity has an accounting policy choice to classify, in either the operating category or the financing category, the income and expenses from liabilities that arise from transactions that involve only the raising of finance and do not relate to providing financing to customers."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch03.html"
  locator: "s-3-pwc-faq-18792"
  new: "An entity that repurchases its own debt at an amount that reflects the debt’s value in the market recognises the difference between the carrying amount of the debt extinguished and the consideration paid as a gain or loss in the statement of profit or loss."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch05.html"
  locator: "s-5-pwc-faq-18992"
  new: "An entity will need to apply judgement in defining the ‘functions’ appropriate to its business and in ensuring that the objective of providing a useful structured summary to users of financial statements will be achieved."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch05.html"
  locator: "s-5-pwc-faq-18942"
  new: "An entity‘s classification of negative effective interest arising on a financial liability in either the financing or operating category depends on whether the entity provides financing to customers as a main business activity, whether the financial liability arises from a transaction that only involves the raising of finance, and whether the financial liability relates to providing financing to customers."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch05.html"
  locator: "s-5-pwc-faq-18942"
  new: "An entity’s classification of negative effective interest on a financial asset in either the investing or operating category depends on whether the financial asset generates a return individually and largely independently of the entity’s other resources, and whether the entity invests in the financial asset as a main business activity."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch02.html"
  locator: "s-2-pwc-faq-18311"
  new: "An important feature of the structure is that the amounts recognised in a statement are included in the totals and subtotals that link the items recognised in the statement."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch06.html"
  locator: "s-6-pwc-faq-181751"
  new: "An individual reportable segment performance measure is not considered to be ‘specifically required’ by an IFRS Accounting Standard."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch03.html"
  locator: "s-3-pwc-ex-18881"
  new: "Analysis Accounting throughout the life of the contract Changes in the fair value of the derivative financial instrument during the life of the contract do not meet the definition of ‘revenue from contracts with customers’ (see FAQ 11.2.1)."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch03.html"
  locator: "s-3-pwc-faq-18812"
  new: "Another way to classify the foreign exchange difference is in the category in which the income and expenses from the intragroup loan would have been classified before elimination."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch07.html"
  locator: "s-7-pwc-faq-181282"
  new: "Answer The demand feature might be primarily a form of protection or a tax-driven feature of the loan."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch03.html"
  locator: "s-3-pwc-faq-18861"
  new: "Answer The grossing up of gains and losses might arise from situations in which an entity uses such financial instruments to manage the net risk of a group of items with offsetting risk positions and the risks managed affect line items in more than one category of the statement of profit or loss."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch07.html"
  locator: "s-7-pwc-faq-181342"
  new: "Answer The puttable debt should be classified in its entirety as current."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch03.html"
  locator: "s-3-pwc-faq-18931"
  new: "Answer Typically these would be presented in the same line in which the initial gain or loss was presented in an earlier year, whether as part of continuing or discontinued operations."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch03.html"
  locator: "s-3-pwc-ex-18867"
  new: "Answer Yes, because in this example the warrants are used to manage an identified risk relating to the purchase of an associate."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch06.html"
  locator: "s-6-pwc-faq-181891"
  new: "Any MPM presented on the face of the statement of financial performance will need to comply with these overall requirements."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch07.html"
  locator: "s-7-pwc-faq-181361"
  new: "Any equity components are accounted for in the same way as if they had been issued as separate instruments."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch03.html"
  locator: "s-3-pwc-faq-18591"
  new: "Any other related expenses incurred as a result of the assets should not be classified in the investing category of the statement of profit or loss."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch03.html"
  locator: "s-3-pwc-faq-18631"
  new: "Applying this paragraph, interest income and expenses and the income and expenses arising from changes in interest rates arising from a liability recognised from the above transactions, would be classified in the financing category."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch02.html"
  locator: "s-2-pwc-faq-18341"
  new: "As a final step, if there are scenarios where steps 1 and 2 are insufficient for users to understand the effect of uncertainties on the financial position and performance, an entity considers provision of additional disclosures based on the overarching disclosure requirement in paragraph 20 of IFRS 18."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch02.html"
  locator: "s-2-pwc-faq-18422"
  new: "As a result of performing the remediation activities, part of the decommissioning obligation is fulfilled, resulting in a reduction in the decommissioning liability."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch06.html"
  locator: "s-6-pwc-faq-181831"
  new: "As a result, it will qualify as an MPM if (i) it is used in public communications outside the financial statements, and (ii) it communicates management’s view of an aspect of the financial performance of the entity as a whole. [IFRS 18 App B para B115]. [IFRS 18 para BC346]."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch03.html"
  locator: "s-3-pwc-faq-18585"
  new: "As a result, judgement might be required when performing the assessment."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch03.html"
  locator: "s-3-pwc-ex-18813"
  new: "As a result, no corresponding foreign exchange difference arises on translation of the subsidiary’s intra-group payable."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch01.html"
  locator: "s-1-pwc-faq-18241"
  new: "As a result, the 20X0 comparative information was adjusted in the 20X1 annual financial statements."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch03.html"
  locator: "s-3-pwc-faq-18531"
  new: "As a result, the classification of income and expenses in the subsidiary’s and group’s statement of profit or loss might differ and adjustments will need to be made on consolidation."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch07.html"
  locator: "s-7-pwc-ex-181441"
  new: "As a result, the net cash inflow and outflow in each period would be small."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch03.html"
  locator: "s-3-pwc-ex-18813"
  new: "As a result, these amounts do not remain in the consolidated statement of profit or loss."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch03.html"
  locator: "s-3-pwc-faq-18871"
  new: "As explained in EX 43.40.2, a contract that will be settled by an entity delivering a fixed number of its own equity instruments in exchange for a fixed amount of foreign currency does not meet the fixed-for-fixed condition in IAS 32, and so the written call option would be classified as a derivative financial liability."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch03.html"
  locator: "s-3-pwc-faq-18861"
  new: "As noted in FAQ 46.59.1, when an entity hedges a net position in accordance with IFRS 9, paragraph B6.6.15 of IFRS 9 requires the hedging gains and losses on recycling to be presented as a separate line item in profit or loss from the gain or loss on the hedged item."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch03.html"
  locator: "s-3-pwc-faq-18863"
  new: "As noted in the answer to question 1, an entity classifies income and expenses on a non-derivative financial instrument, which is not designated as a hedging instrument, in the operating, investing or financing category by applying the general classification requirements in IFRS 18."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch03.html"
  locator: "s-3-pwc-faq-18863"
  new: "As noted in the background, because the borrowing arises from a transaction that involves only the raising of finance, foreign exchange differences arising on translation of the foreign-denominated borrowing are classified in the financing category."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch02.html"
  locator: "s-2-pwc-faq-18362"
  new: "As outlined in FAQ 18.38.2, paragraph 24 of IFRS 18 specifies that line items must comprise amounts recognised and measured in accordance with IFRS Accounting Standards."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch02.html"
  locator: "s-2-pwc-faq-18362"
  new: "As outlined in FAQ 18.38.2, paragraph 24 of IFRS 18 specifies that line items must comprise amounts recognised and measured in accordance with IFRS Accounting Standards."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch07.html"
  locator: "s-7-pwc-faq-181344"
  new: "As part of the analysis of the facts and circumstances of the arrangement, it might be important to determine whether the entity has discretion over the contingent settlement condition to defer settlement for at least 12 months after the end of the reporting period: If the entity has discretion over the contingency, it has the right to defer settlement of the liability for at least 12 months after the end of the reporting period."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch07.html"
  locator: "s-7-pwc-faq-181442"
  new: "As revenue increases, debt repayments increase."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch03.html"
  locator: "s-3-pwc-faq-18644"
  new: "As such, where an NCI put liability is issued as part of a business combination transaction, the obligation to acquire the NCI shares does not arise from a transaction that involves only the raising of finance, as described in paragraph 59(a) of IFRS 18."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch03.html"
  locator: "s-3-pwc-ex-18582"
  new: "Assets that meet these criteria are capable of generating returns from holding (and sale) as individual assets."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch02.html"
  locator: "s-2-pwc-ex-18401"
  new: "Assets, liabilities and items of equity: a. property, plant and equipment disaggregated into classes in accordance with IAS 16; b. receivables disaggregated into amounts receivable from trade customers, amounts receivable from related parties, and other receivables; c. inventories disaggregated, in accordance with IAS 2, into items such as production supplies, materials, work in progress and finished goods; d. trade payables disaggregated, in accordance with IAS 7, to provide separately the amounts of those payables that are part of supplier finance arrangements; e. provisions disaggregated according to their nature, such as, provisions for employee benefits, decommissioning liabilities and legal claims; and f. equity disaggregated into various classes, such as paid-in capital, share premium, reserves and retained earnings."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch03.html"
  locator: "s-3-pwc-faq-18868"
  new: "Assume that the entity does not have a specified main business activity of providing financing to customers."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch02.html"
  locator: "s-2-pwc-faq-18331"
  new: "Assuming that the items being considered for aggregation have at least one shared characteristic, it depends on whether doing so would provide a useful structured summary (refer to FAQ 18.31.1)."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
- action: added
  file: "ifrs-18/draft-v1-linked/ch06.html"
  locator: "s-6-pwc-ex-181851"
  new: "At the same time, the measure also communicates management’s view of an aspect of financial performance."
  source: "Accepted CHANGELOG-128 / REPLACE-128 (#128)"
