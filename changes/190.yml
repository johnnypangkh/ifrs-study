  file: "ifrs-18/draft-v1-linked/ch03.html"
  locator: "s-3-pwc-faq-18603"
  new: "While income and expenses from cash and cash equivalents are typically classified in the investing category, there are certain exceptions that could result in some or all of these income and expenses being classified in the operating category instead: a. where the entity invests in financial assets that generate a return individually and largely independently of other resources of the entity as a main business activity; or b. where the entity provides financing to customers as a main business activity."
