  locator: "s-5-2"
  old: "Write-down to NRV. The amount of any write-down of inventories to net realisable value and all losses of inventories shall be recognised as an expense in the period the write-down or loss occurs. Although the inventory is not derecognised, a write-down to NRV results in the amount of the inventory that has been written down being recognised as an expense in the period in which the write-down occurs; when the NRV of an item is less than its cost, the excess is written off immediately in profit or loss."
  new: "Write-down to NRV. The amount of any write-down of inventories to net realisable value and all losses of inventories shall be recognised as an expense in the period the write-down or loss occurs. Although the inventory is not derecognised, a write-down to NRV results in the amount of the inventory that has been written down being recognised as an expense in the period in which the write-down occurs; when the NRV of an item is less than its cost, the excess is written off immediately in P&L."
  source: "Johnny ruling 2026-10-11 + IAS 2 Content #68 review"
