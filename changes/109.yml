  old: "6.5 tip — replaced-part write-off. When the cost of a replacement is recognised in the carrying amount, derecognise the carrying amount of the replaced part whether or not it was depreciated separately. If that carrying amount is not practicable to determine, the replacement cost may indicate the original cost (para 70 / para 13). Where there are no disposal proceeds, the write-off is a loss on derecognition in profit or loss (para 68 / para 71) — in the pump case, CU51,000. Full numeric plate: Illustration 2.6.2."
