- action: changed
  file: "cf-2018/draft-v1-linked/ch07.html"
  locator: "s-7-5"
  old: "No definition of profit or loss was possible. Earlier decisions to put items outside profit or loss were made for particular reasons in particular projects, and the 1989 and 2010 Frameworks did not mention other comprehensive income. No single characteristic, or small number of characteristics, is shared by all items in profit or loss but not by items better placed in other comprehensive income, so a robust conceptual definition of either is not possible. A prescriptive list of profit or loss categories could never be complete and would push items into other comprehensive income; stakeholder proposals reached no consensus; and a 2013 approach defining a few categories for other comprehensive income lacked support. The Board instead built on the description of the statement as the primary source: excluding items without compelling reasons could make it less useful. The Board treated the lack of guidance on reporting financial performance as a significant gap and left room for further work."
  new: "No definition of P&L was possible. Earlier decisions to put items outside P&L were made for particular reasons in particular projects, and the 1989 and 2010 Frameworks did not mention OCI. No single characteristic, or small number of characteristics, is shared by all items in P&L but not by items better placed in OCI, so a robust conceptual definition of either is not possible. A prescriptive list of P&L categories could never be complete and would push items into OCI; stakeholder proposals reached no consensus; and a 2013 approach defining a few categories for OCI lacked support. The Board instead built on the description of the statement as the primary source: excluding items without compelling reasons could make it less useful. The Board treated the lack of guidance on reporting financial performance as a significant gap and left room for further work."
  source: "Johnny ruling + CF Content #68 review"
