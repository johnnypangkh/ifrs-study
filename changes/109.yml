  new: "Producers — net realisable value. Producers of agricultural and forest products, agricultural produce after harvest, and minerals and mineral products. To the extent such inventories are measured at net realisable value in accordance with well-established practices in those industries, changes in that value are recognised in P&L in the period of the change. These inventories are measured at net realisable value at certain stages of production — Case Treatment Producers The exemption applies only to producers Entities that process or convert these products There is no exemption for entities that process or convert these products."
