  old: "Common costs of a multi-unit property development — allocated on a systematic and rational basis. If an entity constructs individual units as part of a single complex with the objective of selling them, it distinguishes between: Cost Allocation Costs specifically attributable to each unit (for example, flooring) Specifically attributable to each unit Common costs attributable to the complex as a whole (for example, land) The common costs are allocated to each unit on a systematic and rational basis that provides a reasonable approximation of the cost attributable to the individual items, reflecting the construction efforts as well as the cost of a unit. Relative fair values are used only if fair value is a reasonable approximation of cost; if there is a considerable difference between the individual items’ cost and fair value, an allocation on relative fair values could misallocate common costs."
  new: "Common costs of a multi-unit property development — allocated on a systematic and rational basis. If an entity constructs individual units as part of a single complex with the objective of selling them, it distinguishes between: Cost Allocation Costs specifically attributable to each unit (for example, flooring) Specifically attributable to each unit Common costs attributable to the complex as a whole (for example, land) The common costs are allocated to each unit on a systematic and rational basis that provides a reasonable approximation of the cost attributable to the individual items, reflecting the construction efforts as well as the cost of a unit. Relative FV are used only if FV is a reasonable approximation of cost; if there is a considerable difference between the individual items’ cost and FV, an allocation on relative FV could misallocate common costs."
