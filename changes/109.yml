  locator: "s-4-9"
  old: "IFRIC 1 addresses how to account for changes in the measurement of existing decommissioning, restoration and similar liabilities. Under the cost model, changes other than the unwinding of the discount are added to or deducted from the cost of the related asset in the current period (subject to not reducing carrying amount below zero; consider IAS 36 if cost increases). Under the revaluation model, such changes generally adjust the revaluation surplus or deficit for that asset; a change in the liability is also an indicator that fair value may have changed."
  new: "IFRIC 1 addresses how to account for changes in the measurement of existing decommissioning, restoration and similar liabilities. Under the cost model, changes other than the unwinding of the discount are added to or deducted from the cost of the related asset in the current period (subject to not reducing carrying amount below zero; consider IAS 36 if cost increases). Under the revaluation model, such changes generally adjust the revaluation surplus or deficit for that asset; a change in the liability is also an indicator that FV may have changed."
  source: "Johnny ruling 2026-10-11 + IAS 16 Content #68 review"
