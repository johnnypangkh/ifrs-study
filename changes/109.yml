  locator: "s-6-4"
  old: "IFRS 16 overrides the default gain-in-P&L rule on a sale and leaseback. Para 68 includes gain or loss in profit or loss when the item is derecognised unless IFRS 16 requires otherwise on a sale and leaseback. An asset disposed of via sale and leaseback is accounted for under IFRS 16. Under IFRS 16, a seller-lessee derecognises the underlying asset only if the transfer leg satisfies IFRS 15’s requirements to be accounted for as a sale. Full sale-and-leaseback accounting lives in IFRS 16 — thin tip only."
