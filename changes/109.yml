  old: "The costs of purchase comprise the purchase price, import duties and other non-recoverable taxes, and transport, handling and other directly attributable costs. Purchase cost starts from the purchase price plus non-recoverable duties, taxes, transport and handling, less discounts; sales tax enters only when it is not recoverable; a single price for several assets is allocated on relative fair values; exchange differences on foreign-currency invoices stay out of purchase cost; and normal material wastage is product cost while abnormal wastage is expensed."
  new: "The costs of purchase comprise the purchase price, import duties and other non-recoverable taxes, and transport, handling and other directly attributable costs. Purchase cost starts from the purchase price plus non-recoverable duties, taxes, transport and handling, less discounts; sales tax enters only when it is not recoverable; a single price for several assets is allocated on relative FV; exchange differences on foreign-currency invoices stay out of purchase cost; and normal material wastage is product cost while abnormal wastage is expensed."
