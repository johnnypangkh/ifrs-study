  locator: "s-3-7a-differ"
  old: "If the future payment relates to the cost of the asset, two approaches are observed. Cost accumulation: contingent consideration is not included on initial recognition; it is added to the cost initially recorded when incurred, or when a related liability is remeasured for changes in cash flows. Financial-liability model: estimated future amounts payable are recorded on initial recognition of the asset, with a corresponding liability; remeasurements and additional payments are recognised in profit or loss or capitalised. Cost accumulation is more common. Both approaches are acceptable. Apply one policy consistently to all similar transactions and disclose it appropriately."
  new: "If the future payment relates to the cost of the asset, two approaches are observed. Cost accumulation: contingent consideration is not included on initial recognition; it is added to the cost initially recorded when incurred, or when a related liability is remeasured for changes in cash flows. Financial-liability model: estimated future amounts payable are recorded on initial recognition of the asset, with a corresponding liability; remeasurements and additional payments are recognised in P&L or capitalised. Cost accumulation is more common. Both approaches are acceptable. Apply one policy consistently to all similar transactions and disclose it appropriately."
  source: "Johnny ruling 2026-10-11 + IAS 16 Content #68 review"
