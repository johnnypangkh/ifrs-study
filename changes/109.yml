  old: "Three new categories, two new defined subtotals: …three new defined categories (operating, investing and financing)… and requires entities to present two new defined subtotals (operating profit and profit before financing and income taxes). Operating is the default (not “recurring only”): The operating category is the default category and consists of all income and expenses that are not classified in any of the other categories… includes, but is not limited to, income and expenses from an entity’s main business activities regardless of whether they are volatile or non-recurring… Investors use operating profit to measure performance in business activities and as a starting point for forecasting future cash flows. Investing — stand-alone returns; financing — performance before financing effects: investing holds income and expenses from assets that generate returns separately from the entity’s business activities, from cash and cash equivalents, and from investments in associates and joint ventures, so investors can analyse returns from stand-alone investments separately from operations. Financing holds income and expenses on liabilities from transactions that involve only the raising of finance (such as bank loans and bonds) and interest expenses on any other liability (such as lease and pension liabilities); with the profit-before-financing-and-income-taxes subtotal, investors can analyse performance before financing. Specified main business activities: entities that provide financing to customers or invest in assets as a main business activity classify in operating some income and expenses that would otherwise be investing or financing. Foreign exchange, derivatives and hybrid contracts: foreign exchange differences go in the same category as the income and expenses from the items that gave rise to them, with an undue-cost-or-effort relief to classify them in operating; specific requirements apply to fair value gains and losses on derivatives and hedging instruments and to income and expenses from hybrid contracts. Operating expenses by nature or function: by-function presenters disclose in the notes depreciation, amortisation, employee benefits, impairment losses and write-downs of inventories included in each operating line item."
  new: "Three new categories, two new defined subtotals: …three new defined categories (operating, investing and financing)… and requires entities to present two new defined subtotals (operating profit and profit before financing and income taxes). Operating is the default (not “recurring only”): The operating category is the default category and consists of all income and expenses that are not classified in any of the other categories… includes, but is not limited to, income and expenses from an entity’s main business activities regardless of whether they are volatile or non-recurring… Investors use operating profit to measure performance in business activities and as a starting point for forecasting future cash flows. Investing — stand-alone returns; financing — performance before financing effects: investing holds income and expenses from assets that generate returns separately from the entity’s business activities, from cash and cash equivalents, and from investments in associates and joint ventures, so investors can analyse returns from stand-alone investments separately from operations. Financing holds income and expenses on liabilities from transactions that involve only the raising of finance (such as bank loans and bonds) and interest expenses on any other liability (such as lease and pension liabilities); with the profit-before-financing-and-income-taxes subtotal, investors can analyse performance before financing. Specified main business activities: entities that provide financing to customers or invest in assets as a main business activity classify in operating some income and expenses that would otherwise be investing or financing. Foreign exchange, derivatives and hybrid contracts: foreign exchange differences go in the same category as the income and expenses from the items that gave rise to them, with an undue-cost-or-effort relief to classify them in operating; specific requirements apply to FV gains and losses on derivatives and hedging instruments and to income and expenses from hybrid contracts. Operating expenses by nature or function: by-function presenters disclose in the notes depreciation, amortisation, employee benefits, impairment losses and write-downs of inventories included in each operating line item."
