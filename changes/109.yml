- action: changed
  file: "cf-2018/draft-v1-linked/ch06.html"
  locator: "s-6-3"
  old: "Value in use and fulfilment value take the entity’s view. Value in use is the present value of the cash flows, or other economic benefits, an entity expects from using an asset and from its ultimate disposal; fulfilment value is the present value of the cash or other resources it expects to be obliged to transfer to fulfil a liability — including amounts to other parties that enable it to fulfil. Both reflect the same factors as fair value from an entity-specific perspective (in practice there may be little difference), cannot be observed directly, and exclude acquisition transaction costs but include the present value of expected disposal or fulfilment transaction costs. Value in use and fulfilment value derive from IAS 36, form a separate basis rather than only an impairment input, and include a risk premium."
  new: "Value in use and fulfilment value take the entity’s view. Value in use is the present value of the cash flows, or other economic benefits, an entity expects from using an asset and from its ultimate disposal; fulfilment value is the present value of the cash or other resources it expects to be obliged to transfer to fulfil a liability — including amounts to other parties that enable it to fulfil. Both reflect the same factors as FV from an entity-specific perspective (in practice there may be little difference), cannot be observed directly, and exclude acquisition transaction costs but include the present value of expected disposal or fulfilment transaction costs. Value in use and fulfilment value derive from IAS 36, form a separate basis rather than only an impairment input, and include a risk premium."
  source: "Johnny ruling + CF Content #68 review"
- action: changed
  file: "cf-2018/draft-v1-linked/ch06.html"
  locator: "s-6-4-matrix-liab-pl"
  old: "Each basis tells users something different. HC info is relevant because it uses the originating transaction price; margins from sale/consumption/fulfilment can have predictive and confirmatory value. FV reflects market participants’ current expectations (predictive + confirmatory); separate factors in FV changes can be useful. VIU/fulfilment provide entity-path cash-flow present values. Current cost supports current margins analogous to HC but at measurement-date entry prices. Historical cost gives information on recovery and margins and has predictive, confirmatory and stewardship value, while fair value reflects market expectations and can create day-one and exit effects. Value in use and fulfilment value reflect the entity’s cash flows, and current cost shows current margins and holding gains."
  new: "Each basis tells users something different. HC info is relevant because it uses the originating transaction price; margins from sale/consumption/fulfilment can have predictive and confirmatory value. FV reflects market participants’ current expectations (predictive + confirmatory); separate factors in FV changes can be useful. VIU/fulfilment provide entity-path cash-flow present values. Current cost supports current margins analogous to HC but at measurement-date entry prices. Historical cost gives information on recovery and margins and has predictive, confirmatory and stewardship value, while FV reflects market expectations and can create day-one and exit effects. Value in use and fulfilment value reflect the entity’s cash flows, and current cost shows current margins and holding gains."
  source: "Johnny ruling + CF Content #68 review"
- action: changed
  file: "cf-2018/draft-v1-linked/ch06.html"
  locator: "s-6-9"
  old: "Techniques, not measurement bases. When a measure cannot be observed directly, one way to estimate it is a cash-flow-based technique. Such techniques are used in applying a basis, so it is necessary to identify the basis and how far the technique reflects that basis’s factors — for fair value, those in 6.14. The 2013 Discussion Paper treated cash-flow-based measurements as a separate category; the 2018 Framework does not. Cash-flow-based techniques can apply modified bases or central estimates, but a central estimate carries no price for uncertainty and range information may still be needed."
  new: "Techniques, not measurement bases. When a measure cannot be observed directly, one way to estimate it is a cash-flow-based technique. Such techniques are used in applying a basis, so it is necessary to identify the basis and how far the technique reflects that basis’s factors — for FV, those in 6.14. The 2013 Discussion Paper treated cash-flow-based measurements as a separate category; the 2018 Framework does not. Cash-flow-based techniques can apply modified bases or central estimates, but a central estimate carries no price for uncertainty and range information may still be needed."
  source: "Johnny ruling + CF Content #68 review"
- action: changed
  file: "cf-2018/draft-v1-linked/ch06.html"
  locator: "s-6-3"
  old: "Current cost is a current entry value. The current cost of an asset is the cost of an equivalent asset at the measurement date (consideration plus transaction costs); of a liability, the consideration that would be received for an equivalent liability minus transaction costs. Like historical cost it is an entry value; unlike historical cost it reflects conditions at the measurement date — whereas fair value, value in use and fulfilment value are exit values. If prices exist only for new assets, a used asset’s current cost may be estimated by adjusting for age and condition."
  new: "Current cost is a current entry value. The current cost of an asset is the cost of an equivalent asset at the measurement date (consideration plus transaction costs); of a liability, the consideration that would be received for an equivalent liability minus transaction costs. Like historical cost it is an entry value; unlike historical cost it reflects conditions at the measurement date — whereas FV, value in use and fulfilment value are exit values. If prices exist only for new assets, a used asset’s current cost may be estimated by adjusting for age and condition."
  source: "Johnny ruling + CF Content #68 review"
- action: changed
  file: "cf-2018/draft-v1-linked/ch06.html"
  locator: "s-6-0"
  old: "Measurement quantifies recognised elements in monetary terms by applying a measurement basis. A measurement basis is an identified feature — for example historical cost, fair value or fulfilment value — of the item being measured; applying it to an asset or liability creates a measure for that item and for the related income and expenses. The Framework does not prescribe specific bases: it describes them and expects that the qualitative characteristics and the cost constraint will lead to different bases for different assets, liabilities, income and expenses."
  new: "Measurement quantifies recognised elements in monetary terms by applying a measurement basis. A measurement basis is an identified feature — for example historical cost, FV or fulfilment value — of the item being measured; applying it to an asset or liability creates a measure for that item and for the related income and expenses. The Framework does not prescribe specific bases: it describes them and expects that the qualitative characteristics and the cost constraint will lead to different bases for different assets, liabilities, income and expenses."
  source: "Johnny ruling + CF Content #68 review"
- action: changed
  file: "cf-2018/draft-v1-linked/ch06.html"
  locator: "s-6-1"
  old: "A single basis was considered and rejected. A single basis would let amounts be added, subtracted and compared more meaningfully and make statements less complex; it would also be needed to measure a concept of wealth or capital, which the Board decided not to seek. Nearly all respondents supported mixed measurement; a few proposed historical cost, fair value, current entry value or deprival (relief) value, and most of them conceded a single basis was not achievable in practice."
  new: "A single basis was considered and rejected. A single basis would let amounts be added, subtracted and compared more meaningfully and make statements less complex; it would also be needed to measure a concept of wealth or capital, which the Board decided not to seek. Nearly all respondents supported mixed measurement; a few proposed historical cost, FV, current entry value or deprival (relief) value, and most of them conceded a single basis was not achievable in practice."
  source: "Johnny ruling + CF Content #68 review"
- action: changed
  file: "cf-2018/draft-v1-linked/ch02.html"
  locator: "s-2-3"
  old: "Complete — everything a user needs to understand the phenomenon. Includes all necessary descriptions and explanations — for a group of assets, at a minimum a description of their nature, a numerical depiction of all the assets, and what that depiction represents (for example, historical cost or fair value). For some items it also covers significant facts about their quality and nature, factors that might affect them, and the process used to determine the numerical depiction."
  new: "Complete — everything a user needs to understand the phenomenon. Includes all necessary descriptions and explanations — for a group of assets, at a minimum a description of their nature, a numerical depiction of all the assets, and what that depiction represents (for example, historical cost or FV). For some items it also covers significant facts about their quality and nature, factors that might affect them, and the process used to determine the numerical depiction."
  source: "Johnny ruling + CF Content #68 review"
- action: changed
  file: "cf-2018/draft-v1-linked/ch06.html"
  locator: "s-6-4-matrix-liab-pl"
  old: "Fair value — market expectations. It reflects market participants’ current expectations of the amount, timing and uncertainty of cash flows, priced at their current risk preferences, giving predictive and confirmatory value; related income and expenses can feed predictions and help assess stewardship. Separately identifying changes from factors with different characteristics can be useful."
  new: "FV — market expectations. It reflects market participants’ current expectations of the amount, timing and uncertainty of cash flows, priced at their current risk preferences, giving predictive and confirmatory value; related income and expenses can feed predictions and help assess stewardship. Separately identifying changes from factors with different characteristics can be useful."
  source: "Johnny ruling + CF Content #68 review"
- action: changed
  file: "cf-2018/draft-v1-linked/ch06.html"
  locator: "s-6-6"
  old: "Market terms — the same basis avoids a day-2 gain or loss. Even when cost and fair value are similar, it is necessary to describe which basis is used initially. If historical cost will be used subsequently, it is normally also appropriate initially; likewise for a current value. When an item is acquired in exchange for transferring another on market terms, the initial measure of the item acquired determines whether income or expenses arise."
  new: "Market terms — the same basis avoids a day-2 gain or loss. Even when cost and FV are similar, it is necessary to describe which basis is used initially. If historical cost will be used subsequently, it is normally also appropriate initially; likewise for a current value. When an item is acquired in exchange for transferring another on market terms, the initial measure of the item acquired determines whether income or expenses arise."
  source: "Johnny ruling + CF Content #68 review"
- action: changed
  file: "cf-2018/draft-v1-linked/ch06.html"
  locator: "s-6-5"
  old: "Fair value changes are not always informative. They reflect changes in market participants’ expectations and risk preferences, which may not have predictive or confirmatory value when the entity does not sell the asset or transfer the liability — for example, assets held solely for use or to collect contractual cash flows, or liabilities the entity fulfils itself."
  new: "FV changes are not always informative. They reflect changes in market participants’ expectations and risk preferences, which may not have predictive or confirmatory value when the entity does not sell the asset or transfer the liability — for example, assets held solely for use or to collect contractual cash flows, or liabilities the entity fulfils itself."
  source: "Johnny ruling + CF Content #68 review"
- action: changed
  file: "cf-2018/draft-v1-linked/ch06.html"
  locator: "s-6-3"
  old: "Fair value takes the market participant’s view. It is the price that would be received to sell an asset, or paid to transfer a liability, in an orderly transaction between market participants at the measurement date, using the assumptions those participants — in a market the entity can access — would use when acting in their economic best interest. It may be observed directly in an active market, or estimated with techniques such as cash-flow-based measurement reflecting the factors below. A cash-flow-based estimate of fair value reflects estimates of future cash flows, possible variations in their amount or timing, the time value of money, the price for bearing uncertainty, and other factors such as liquidity."
  new: "FV takes the market participant’s view. It is the price that would be received to sell an asset, or paid to transfer a liability, in an orderly transaction between market participants at the measurement date, using the assumptions those participants — in a market the entity can access — would use when acting in their economic best interest. It may be observed directly in an active market, or estimated with techniques such as cash-flow-based measurement reflecting the factors below. A cash-flow-based estimate of FV reflects estimates of future cash flows, possible variations in their amount or timing, the time value of money, the price for bearing uncertainty, and other factors such as liquidity."
  source: "Johnny ruling + CF Content #68 review"
- action: changed
  file: "cf-2018/draft-v1-linked/ch10.html"
  locator: "s-10-5"
  old: "Allocate the actual costs incurred by the larger reporting entity on a rational basis appropriate to each item — not necessarily fair value and not necessarily the inter-company charge: standardised HR by headcount, specialised IT by actual usage. The approach has technical merit for combined and carve-out statements but is not generic IFRS."
  new: "Allocate the actual costs incurred by the larger reporting entity on a rational basis appropriate to each item — not necessarily FV and not necessarily the inter-company charge: standardised HR by headcount, specialised IT by actual usage. The approach has technical merit for combined and carve-out statements but is not generic IFRS."
  source: "Johnny ruling + CF Content #68 review"
- action: changed
  file: "cf-2018/draft-v1-linked/ch07.html"
  locator: "s-7-5"
  old: "Two terms kept for clarity. “Statement(s) of financial performance” covers the profit or loss statement or section together with the other comprehensive income statement or section — consistent with “statement of financial position” and clearer than “statement of comprehensive income”. “Other comprehensive income”, introduced in 2007, means income and expenses not included in profit or loss; some find it neither descriptive nor well understood, but changing it could confuse."
  new: "Two terms kept for clarity. “Statement(s) of financial performance” covers the profit or loss statement or section together with the other comprehensive income statement or section — consistent with “statement of financial position” and clearer than “statement of comprehensive income”. “Other comprehensive income”, introduced in 2007, means income and expenses not included in P&L; some find it neither descriptive nor well understood, but changing it could confuse."
  source: "Johnny ruling + CF Content #68 review"
- action: changed
  file: "cf-2018/draft-v1-linked/ch06.html"
  locator: "s-6-8"
  old: "Sometimes more than one basis is needed to give relevant information that faithfully represents both financial position and financial performance. Usually one basis is used in the statements and another in the notes, but sometimes current value is used in the statement of financial position and a different basis in profit or loss. The OCI mechanics then put the rest of the change in current value in OCI, and the Board would require this only in exceptional circumstances."
  new: "Sometimes more than one basis is needed to give relevant information that faithfully represents both financial position and financial performance. Usually one basis is used in the statements and another in the notes, but sometimes current value is used in the statement of financial position and a different basis in P&L. The OCI mechanics then put the rest of the change in current value in OCI, and the Board would require this only in exceptional circumstances."
  source: "Johnny ruling + CF Content #68 review"
- action: changed
  file: "cf-2018/draft-v1-linked/ch06.html"
  locator: "s-6-1"
  old: "Entry vs exit is not how bases are categorised. The Board rejected grouping bases by inputs (entry values such as historical cost and current cost) versus outputs (exit values such as fair value, value in use and fulfilment value), because entry and exit values in the same market often differ little except for transaction costs."
  new: "Entry vs exit is not how bases are categorised. The Board rejected grouping bases by inputs (entry values such as historical cost and current cost) versus outputs (exit values such as FV, value in use and fulfilment value), because entry and exit values in the same market often differ little except for transaction costs."
  source: "Johnny ruling + CF Content #68 review"
- action: changed
  file: "cf-2018/draft-v1-linked/ch06.html"
  locator: "s-6-5"
  old: "Three kinds of uncertainty. Outcome uncertainty (amount or timing of flows) and existence uncertainty (whether the item exists) differ from measurement uncertainty; they may contribute to it but need not — a fair value observed in an active market carries no measurement uncertainty even if the cash it will produce is uncertain."
  new: "Three kinds of uncertainty. Outcome uncertainty (amount or timing of flows) and existence uncertainty (whether the item exists) differ from measurement uncertainty; they may contribute to it but need not — a FV observed in an active market carries no measurement uncertainty even if the cash it will produce is uncertain."
  source: "Johnny ruling + CF Content #68 review"
- action: changed
  file: "cf-2018/draft-v1-linked/ch06.html"
  locator: "s-6-3"
  old: "A separate basis, not only an impairment input. Some Standards use value in use only to determine recoverable amount; the Framework still identifies it separately because it differs conceptually from historical cost, and the Board might choose an entity-specific current value instead of fair value in some circumstances."
  new: "A separate basis, not only an impairment input. Some Standards use value in use only to determine recoverable amount; the Framework still identifies it separately because it differs conceptually from historical cost, and the Board might choose an entity-specific current value instead of FV in some circumstances."
  source: "Johnny ruling + CF Content #68 review"
- action: changed
  file: "cf-2018/draft-v1-linked/ch06.html"
  locator: "s-6-5"
  old: "Relevance depends on the item’s characteristics. In particular, the variability of its cash flows and whether its value is sensitive to market factors or other risks. For market-sensitive items historical cost may miss what users need, it reports value changes late, and fair value changes are not always informative."
  new: "Relevance depends on the item’s characteristics. In particular, the variability of its cash flows and whether its value is sensitive to market factors or other risks. For market-sensitive items historical cost may miss what users need, it reports value changes late, and FV changes are not always informative."
  source: "Johnny ruling + CF Content #68 review"
- action: changed
  file: "cf-2018/draft-v1-linked/ch06.html"
  locator: "s-6-3"
  old: "Fair value ignores transaction costs on both sides. It is not increased by acquisition costs or decreased by costs of incurring a liability, and does not reflect costs of ultimate disposal, transfer or settlement. The description is consistent with IFRS 13."
  new: "FV ignores transaction costs on both sides. It is not increased by acquisition costs or decreased by costs of incurring a liability, and does not reflect costs of ultimate disposal, transfer or settlement. The description is consistent with IFRS 13."
  source: "Johnny ruling + CF Content #68 review"
- action: changed
  file: "cf-2018/draft-v1-linked/ch06.html"
  locator: "s-6-6-ex"
  old: "Use the subsequent basis at initial recognition, and describe which basis is used — cost is normally similar to fair value unless transaction costs are significant; measured at cost, no income or expenses arise initially unless from derecognising a transferred item, impairment or an onerous liability."
  new: "Use the subsequent basis at initial recognition, and describe which basis is used — cost is normally similar to FV unless transaction costs are significant; measured at cost, no income or expenses arise initially unless from derecognising a transferred item, impairment or an onerous liability."
  source: "Johnny ruling + CF Content #68 review"
- action: changed
  file: "cf-2018/draft-v1-linked/ch06.html"
  locator: "s-6-4-matrix-liab-pl"
  old: "Table 6.1 notes — liabilities. Income or expenses may arise on initial recognition of a liability not incurred or taken on at market terms, or if the market in which it is incurred differs from the market that is the source of the prices used for its fair value."
  new: "Table 6.1 notes — liabilities. Income or expenses may arise on initial recognition of a liability not incurred or taken on at market terms, or if the market in which it is incurred differs from the market that is the source of the prices used for its FV."
  source: "Johnny ruling + CF Content #68 review"
- action: changed
  file: "cf-2018/draft-v1-linked/ch07.html"
  locator: "s-7-5-ex"
  old: "Profit or loss — the default location. All income and expenses are in principle included there. Income and expenses on a historical cost basis are included, also when separately identified within a change in current value — for example, interest income on a financial asset measured at current value."
  new: "P&L — the default location. All income and expenses are in principle included there. Income and expenses on a historical cost basis are included, also when separately identified within a change in current value — for example, interest income on a financial asset measured at current value."
  source: "Johnny ruling + CF Content #68 review"
- action: changed
  file: "cf-2018/draft-v1-linked/ch07.html"
  locator: "s-7-5"
  old: "Reclassification (“recycling”) now follows one principle. Earlier Standards required or prohibited it, reflecting approaches that changed over time — one view treated the statement(s) of financial performance as a single statement in which each item appears once; another wanted all income and expenses in profit or loss at some point. To stop decisions fluctuating, the Board set one principle: if profit or loss is the primary source, cumulative amounts in it over time should be as complete as possible, so items are permanently excluded only for a compelling reason."
  new: "Reclassification (“recycling”) now follows one principle. Earlier Standards required or prohibited it, reflecting approaches that changed over time — one view treated the statement(s) of financial performance as a single statement in which each item appears once; another wanted all income and expenses in P&L at some point. To stop decisions fluctuating, the Board set one principle: if P&L is the primary source, cumulative amounts in it over time should be as complete as possible, so items are permanently excluded only for a compelling reason."
  source: "Johnny ruling + CF Content #68 review"
- action: changed
  file: "cf-2018/draft-v1-linked/ch06.html"
  locator: "s-6-1"
  old: "In practice most items are at historical cost. Some Standards use fair values (for example IAS 19, IFRS 9, IAS 40, IAS 41 and IFRS 2), but property, plant and equipment, intangibles and inventories are generally at historical cost, as are most liabilities; financial institutions use fair value for a substantial proportion of assets, while for many entities it is confined to some financial assets."
  new: "In practice most items are at historical cost. Some Standards use FV (for example IAS 19, IFRS 9, IAS 40, IAS 41 and IFRS 2), but property, plant and equipment, intangibles and inventories are generally at historical cost, as are most liabilities; financial institutions use FV for a substantial proportion of assets, while for many entities it is confined to some financial assets."
  source: "Johnny ruling + CF Content #68 review"
- action: changed
  file: "cf-2018/draft-v1-linked/ch07.html"
  locator: "s-7-5"
  old: "Presumes reclassification, but it “must provide more relevant information than not reclassifying the amounts”; if there is no clear basis that it will give more useful information about profit or loss in a future period, the Board may decide it should not take place."
  new: "Presumes reclassification, but it “must provide more relevant information than not reclassifying the amounts”; if there is no clear basis that it will give more useful information about P&L in a future period, the Board may decide it should not take place."
  source: "Johnny ruling + CF Content #68 review"
- action: changed
  file: "cf-2018/draft-v1-linked/ch07.html"
  locator: "s-7-5"
  old: "“The Board might call for items of income and expense to be deferred through other comprehensive income”; in principle reclassified to profit or loss in a future period, but where there is no clear basis to identify that period the amounts might not be reclassified."
  new: "“The Board might call for items of income and expense to be deferred through other comprehensive income”; in principle reclassified to P&L in a future period, but where there is no clear basis to identify that period the amounts might not be reclassified."
  source: "Johnny ruling + CF Content #68 review"
- action: changed
  file: "cf-2018/draft-v1-linked/ch06.html"
  locator: "s-6-4-matrix-liab-pl"
  old: "Fair value — day-one and exit effects. If an asset is bought in one market and measured using prices in the market where it would be sold, the price difference is income when fair value is first determined; a later sale or transfer in the source market would normally give small net income or expenses unless transaction costs are significant."
  new: "FV — day-one and exit effects. If an asset is bought in one market and measured using prices in the market where it would be sold, the price difference is income when FV is first determined; a later sale or transfer in the source market would normally give small net income or expenses unless transaction costs are significant."
  source: "Johnny ruling + CF Content #68 review"
- action: changed
  file: "cf-2018/draft-v1-linked/ch06.html"
  locator: "s-6-0-ex"
  old: "Measurement is not a recognition test. The Framework favours neither family, and current value is not fair value only — value in use, fulfilment value and current cost are siblings."
  new: "Measurement is not a recognition test. The Framework favours neither family, and current value is not FV only — value in use, fulfilment value and current cost are siblings."
  source: "Johnny ruling + CF Content #68 review"
- action: changed
  file: "cf-2018/draft-v1-linked/ch06.html"
  locator: "s-6-1"
  old: "“Value” means economic value. In the chapter, “value” refers to an economic value of an item, not its carrying amount and not a specific current value such as fair value."
  new: "“Value” means economic value. In the chapter, “value” refers to an economic value of an item, not its carrying amount and not a specific current value such as FV."
  source: "Johnny ruling + CF Content #68 review"
- action: changed
  file: "cf-2018/draft-v1-linked/ch07.html"
  locator: "s-7-5"
  old: "The statement of profit or loss is the primary source of information about performance for the period. Its total for profit or loss is a highly summarised depiction of performance, and many users incorporate that total in their analysis as a starting point or as the main indicator. Understanding performance still requires analysing all recognised income and expenses — including those in other comprehensive income — and other information in the financial statements. The Framework does not specify one statement or two, its terms cover either layout with the choice left to Standards, and two terms are kept for clarity."
  new: "The statement of profit or loss is the primary source of information about performance for the period. Its total for P&L is a highly summarised depiction of performance, and many users incorporate that total in their analysis as a starting point or as the main indicator. Understanding performance still requires analysing all recognised income and expenses — including those in OCI — and other information in the financial statements. The Framework does not specify one statement or two, its terms cover either layout with the choice left to Standards, and two terms are kept for clarity."
  source: "Johnny ruling + CF Content #68 review"
- action: changed
  file: "cf-2018/draft-v1-linked/ch11.html"
  locator: "s-11-1"
  old: "A few aspects of the Framework can be applied only by the Board. Preparers apply the Framework when no Standard applies or a Standard allows a choice, but in some places the Framework says the Board may make particular decisions in developing Standards — for example, paragraph 7.17 on including income or expenses in other comprehensive income. See also 7.5"
  new: "A few aspects of the Framework can be applied only by the Board. Preparers apply the Framework when no Standard applies or a Standard allows a choice, but in some places the Framework says the Board may make particular decisions in developing Standards — for example, paragraph 7.17 on including income or expenses in OCI. See also 7.5"
  source: "Johnny ruling + CF Content #68 review"
- action: changed
  file: "cf-2018/draft-v1-linked/ch07.html"
  locator: "s-7-0"
  old: "High-level concepts, with principles on OCI. The chapter gives high-level presentation and disclosure concepts. The statement of profit or loss is the primary source of information about performance and the default location for income and expenses; only in exceptional circumstances may the Board, when developing Standards, decide that income or expenses arising from a change in the current value of an asset or liability are included in other comprehensive income — when that makes profit or loss more relevant or more faithful for the period."
  new: "High-level concepts, with principles on OCI. The chapter gives high-level presentation and disclosure concepts. The statement of profit or loss is the primary source of information about performance and the default location for income and expenses; only in exceptional circumstances may the Board, when developing Standards, decide that income or expenses arising from a change in the current value of an asset or liability are included in OCI — when that makes P&L more relevant or more faithful for the period."
  source: "Johnny ruling + CF Content #68 review"
- action: changed
  file: "cf-2018/draft-v1-linked/ch07.html"
  locator: "s-7-5"
  old: "The statement of profit or loss is the primary source of information about financial performance for the period; its total is a highly summarised depiction that many users take as a starting point or the main indicator, but understanding performance requires analysing all recognised income and expenses, including other comprehensive income."
  new: "The statement of profit or loss is the primary source of information about financial performance for the period; its total is a highly summarised depiction that many users take as a starting point or the main indicator, but understanding performance requires analysing all recognised income and expenses, including OCI."
  source: "Johnny ruling + CF Content #68 review"
- action: changed
  file: "cf-2018/draft-v1-linked/ch06.html"
  locator: "s-6-8"
  old: "Sometimes: current value in the statement of financial position, a different basis in profit or loss. In some cases that is more relevant or more faithful; the factors in 6.43–6.76 still apply."
  new: "Sometimes: current value in the statement of financial position, a different basis in P&L. In some cases that is more relevant or more faithful; the factors in 6.43–6.76 still apply."
  source: "Johnny ruling + CF Content #68 review"
- action: changed
  file: "cf-2018/draft-v1-linked/ch06.html"
  locator: "s-6-3"
  old: "See also IFRS 13 Fair Value Measurement for the fair-value hierarchy and inputs; this chapter stays at Conceptual Framework level."
  new: "See also IFRS 13 Fair Value Measurement for the FV hierarchy and inputs; this chapter stays at Conceptual Framework level."
  source: "Johnny ruling + CF Content #68 review"
- action: changed
  file: "cf-2018/draft-v1-linked/ch06.html"
  locator: "s-6-8"
  old: "Only in exceptional circumstances. The Board would require this only in exceptional circumstances, and only if it makes profit or loss more relevant or more faithful."
  new: "Only in exceptional circumstances. The Board would require this only in exceptional circumstances, and only if it makes P&L more relevant or more faithful."
  source: "Johnny ruling + CF Content #68 review"
- action: changed
  file: "cf-2018/draft-v1-linked/ch07.html"
  locator: "s-7-5"
  old: "Where profit or loss and the statement of financial position use different measurement bases, reclassification is what makes the two agree over the holding period."
  new: "Where P&L and the statement of financial position use different measurement bases, reclassification is what makes the two agree over the holding period."
  source: "Johnny ruling + CF Content #68 review"
- action: changed
  file: "cf-2018/draft-v1-linked/ch07.html"
  locator: "s-7-5-rc"
  old: "Is there a clear basis for identifying the period in which reclassification would make profit or loss more relevant or more faithful, and the amount to reclassify?"
  new: "Is there a clear basis for identifying the period in which reclassification would make P&L more relevant or more faithful, and the amount to reclassify?"
  source: "Johnny ruling + CF Content #68 review"
- action: changed
  file: "cf-2018/draft-v1-linked/ch07.html"
  locator: "s-7-0"
  old: "The topic is new in 2018. The 2010 Framework did not address presentation and disclosure. Respondents to the Board’s 2011 agenda consultation identified it as a priority — in particular information about financial performance, including the use of other comprehensive income."
  new: "The topic is new in 2018. The 2010 Framework did not address presentation and disclosure. Respondents to the Board’s 2011 agenda consultation identified it as a priority — in particular information about financial performance, including the use of OCI."
  source: "Johnny ruling + CF Content #68 review"
- action: changed
  file: "cf-2018/draft-v1-linked/ch07.html"
  locator: "s-7-5"
  old: "Reclassification completes a two-basis measurement. When one measurement basis is used in the statement of financial position and another in profit or loss ( Ch6 6.8), reclassification is the only way to make cumulative profit or loss over the holding period equal the amount on the basis selected for that statement."
  new: "Reclassification completes a two-basis measurement. When one measurement basis is used in the statement of financial position and another in P&L ( Ch6 6.8), reclassification is the only way to make cumulative P&L over the holding period equal the amount on the basis selected for that statement."
  source: "Johnny ruling + CF Content #68 review"
- action: changed
  file: "cf-2018/draft-v1-linked/ch06.html"
  locator: "s-6-1"
  old: "Two categories of measurement basis: historical cost and current value. Current value is a family — fair value, value in use for assets and fulfilment value for liabilities, and current cost — not a synonym for fair value."
  new: "Two categories of measurement basis: historical cost and current value. Current value is a family — FV, value in use for assets and fulfilment value for liabilities, and current cost — not a synonym for FV."
  source: "Johnny ruling + CF Content #68 review"
- action: changed
  file: "cf-2018/draft-v1-linked/ch06.html"
  locator: "s-6-8"
  old: "The OCI mechanics. Total income or expenses from the change in current value is separated: profit or loss includes the amount on the basis selected for that statement, and OCI the rest — so accumulated OCI for the item equals its carrying amount less the carrying amount on the profit-or-loss basis."
  new: "The OCI mechanics. Total income or expenses from the change in current value is separated: P&L includes the amount on the basis selected for that statement, and OCI the rest — so accumulated OCI for the item equals its carrying amount less the carrying amount on the P&L basis."
  source: "Johnny ruling + CF Content #68 review"
