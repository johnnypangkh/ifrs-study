- action: changed
  file: "ias-2/draft-v1-linked/ch04.html"
  locator: "s-4-2"
  old: "Entity-specific value. Net realisable value refers to the net amount that an entity expects to realise from the sale of inventory in the ordinary course of business. Fair value reflects the price at which an orderly transaction to sell the same inventory in the principal (or most advantageous) market for that inventory would take place between market participants at the measurement date. The former is an entity-specific value; the latter is not. Net realisable value for inventories may not equal fair value less costs to sell. Fair value is the price that would be received to sell an asset or paid to transfer a liability in an orderly transaction between market participants at the measurement date (IFRS 13). That price is a market-participant price."
  new: "Entity-specific value. Net realisable value refers to the net amount that an entity expects to realise from the sale of inventory in the ordinary course of business. Fair value reflects the price at which an orderly transaction to sell the same inventory in the principal (or most advantageous) market for that inventory would take place between market participants at the measurement date. The former is an entity-specific value; the latter is not. Net realisable value for inventories may not equal fair value less costs to sell. FV is the price that would be received to sell an asset or paid to transfer a liability in an orderly transaction between market participants at the measurement date (IFRS 13). That price is a market-participant price."
  source: "Johnny ruling 2026-10-11 + IAS 2 Content #68 review"
- action: changed
  file: "ias-2/draft-v1-linked/ch01.html"
  locator: "s-1-0"
  old: "Historical-cost system. Historical-cost system wording removed — the Standard applies to all inventories not specifically exempted. Both the objective and the scope of the previous version of IAS 2 referred to accounting for inventories under the historical cost system. Party View Some had read those words as limiting IAS 2 to a historical-cost system and permitting a choice of other measurement bases (for example fair value). The Board agreed that wording could produce inconsistent application, and deleted the phrase in the context of the historical cost system in accounting for inventories to clarify that the Standard applies to all inventories that are not specifically exempted from its scope."
  new: "Historical-cost system. Historical-cost system wording removed — the Standard applies to all inventories not specifically exempted. Both the objective and the scope of the previous version of IAS 2 referred to accounting for inventories under the historical cost system. Party View Some had read those words as limiting IAS 2 to a historical-cost system and permitting a choice of other measurement bases (for example FV). The Board agreed that wording could produce inconsistent application, and deleted the phrase in the context of the historical cost system in accounting for inventories to clarify that the Standard applies to all inventories that are not specifically exempted from its scope."
  source: "Johnny ruling 2026-10-11 + IAS 2 Content #68 review"
- action: changed
  file: "ias-16/draft-v1-linked/ch03.html"
  locator: "s-3-7a-differ"
  old: "Initial-recognition policies an entity may consider: include the fair value of all variable or contingent consideration at the acquisition date and recognise a matching liability; or exclude variable or contingent payments from initial cost and recognise no liability for them. Subsequent changes to a recognised liability are included in asset cost only to the extent they relate to future economic benefits embodied in the asset initially received (for example quality or quantity). Variability from use over time is generally expensed. Apply the IAS 8 hierarchy, consistently for similar transactions, and disclose the policy when material."
  new: "Initial-recognition policies an entity may consider: include the FV of all variable or contingent consideration at the acquisition date and recognise a matching liability; or exclude variable or contingent payments from initial cost and recognise no liability for them. Subsequent changes to a recognised liability are included in asset cost only to the extent they relate to future economic benefits embodied in the asset initially received (for example quality or quantity). Variability from use over time is generally expensed. Apply the IAS 8 hierarchy, consistently for similar transactions, and disclose the policy when material."
  source: "Johnny ruling 2026-10-11 + IAS 16 Content #68 review"
- action: changed
  file: "ifrs-18/draft-v1-linked/ch03.html"
  locator: "s-3-0"
  old: "Classify every profit-or-loss amount into one of five categories. IFRS 18 requires an entity to classify income and expenses included in the statement of profit or loss in the operating, investing, financing, income taxes or discontinued operations category. Operating is the residual/default. Investing and financing follow specified asset and liability logic, with overrides when investing in assets or providing financing to customers is a specified main business activity. Income taxes and discontinued operations close the set. Foreign exchange differences, the net monetary position, derivatives and derecognition follow the cross-category rules in 3.7. , (selective) Classifying an amount across the five P&L categories takes three decisions (which band, whether there is a specified MBA, and whether the amount is residual operating), and general and specific requirements apply together."
  new: "Classify every P&L amount into one of five categories. IFRS 18 requires an entity to classify income and expenses included in the statement of profit or loss in the operating, investing, financing, income taxes or discontinued operations category. Operating is the residual/default. Investing and financing follow specified asset and liability logic, with overrides when investing in assets or providing financing to customers is a specified main business activity. Income taxes and discontinued operations close the set. Foreign exchange differences, the net monetary position, derivatives and derecognition follow the cross-category rules in 3.7. , (selective) Classifying an amount across the five P&L categories takes three decisions (which band, whether there is a specified MBA, and whether the amount is residual operating), and general and specific requirements apply together."
  source: "Johnny ruling 2026-10-11 + IFRS 18 Content #68 review"
- action: changed
