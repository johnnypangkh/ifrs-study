  old: "Reliably measurable fair value (para 26). Fair value is reliably measurable if (a) variability in the range of reasonable fair value measurements is not significant, or (b) the probabilities of the various estimates within the range can be reasonably assessed and used. If either asset’s FV is reliably measurable, use FV of the asset given up unless FV of the asset received is more clearly evident."
