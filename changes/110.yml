- action: changed
  file: "ias-16/draft-v1-linked/ch04.html"
  locator: "s-4-5-impair"
  old: "Impairment reversal ≠ automatic revaluation increase: A later reversal of an IAS 36 impairment follows IAS 36 (including the ceiling — cannot reverse above the carrying amount that would have been determined had no impairment been recognised; income-statement path constrained). See Illustration 4.5.4 for the depreciating-asset restriction on P&L reversal."
  new: "Impairment reversal: The carrying amount cannot rise above what it would have been, net of depreciation, had no impairment loss been recognised. On a revalued asset the reversal is treated as a revaluation increase - P&L to the extent it reverses an impairment loss previously recognised in P&L, the rest to OCI. See Illustration 4.5.4."
  source: "IAS 16 Content #70"
