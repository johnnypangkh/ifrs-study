- action: added
  file: "cf-2018/draft-v1-linked/ch01.html"
  locator: "s-1-faq-111"
  new: "IASB country list — use and public commitment. The IASB maintains a list of each country’s use of, and public commitment to, IFRS Accounting Standards and the IFRS for SMEs Accounting Standard. The list is published on the IASB’s website under “Who uses IFRS Accounting Standards?” (ifrs.org). This FAQ does not itself state a country count; it points readers to that maintained list. Standing text reference: 1.1. Publication date 31 Dec 2022 (updated 31 Mar 2025)."
  source: "Accepted CHANGELOG-129 / REPLACE-129 (#129)"
