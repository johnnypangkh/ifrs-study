- action: changed
  file: "ias-16/draft-v1-linked/ch05.html"
  locator: "s-5-9"
  old: "IFRS 16 right-of-use assets often borrow IAS 16 depreciation requirements. Depreciation of a right-of-use asset begins at lease commencement. Useful life of non-removable leasehold improvements is determined under IAS 16.56–57; if the improvements are not expected to be used beyond the lease term, useful life equals the lease term (IFRS IC November 2019). Full lease accounting lives in IFRS 16 — dashed tip only."
  new: "A lessee depreciates a right-of-use asset by applying the IAS 16 depreciation requirements, subject to IFRS 16. Depreciation of a right-of-use asset begins at lease commencement. Useful life of non-removable leasehold improvements is determined under IAS 16.56–57; if the improvements are not expected to be used beyond the lease term, useful life equals the lease term (IFRS IC November 2019). Full lease accounting lives in IFRS 16 — dashed tip only."
  source: "IAS 16 Content #67 item 1a"

