- action: changed
  file: "ias-16/draft-v1-linked/ch01.html"
  locator: "s-1-7"
  old: "See also — IFRS 16. ROU recognition and measurement live in IFRS 16. IAS 16 supplies depreciation requirements that lessees often apply to ROU assets (IFRS 16 · para 31). Sale-and-leaseback gain exceptions appear at derecognition (IAS 16 · para 68) — later chapter."
  new: "See also — IFRS 16. ROU recognition and measurement live in IFRS 16. A lessee depreciates ROU assets by applying the IAS 16 depreciation requirements, subject to IFRS 16 (IFRS 16 · para 31). Sale-and-leaseback gain exceptions appear at derecognition (IAS 16 · para 68) — later chapter."
  source: "IAS 16 Content #67 item 1c"

