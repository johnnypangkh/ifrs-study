- action: changed
  file: "ias-2/draft-v1-linked/ch02.html"
  locator: "s-2-3"
  old: "Seller delivers, but retains control. A seller may deliver goods to another party, such as a dealer or distributor for sale to an end customer, but retain control of them. Arrangements of this kind are common in certain industries, particularly the motor vehicle trade: the manufacturer (or a financier) generally retains title until a predetermined event occurs. Title tends to pass some time after physical transfer, generally on receipt of cleared funds (but not to the dealer if it has already sold the vehicle on). The key issue is the point at which the dealer has, in substance, acquired an asset to recognise in its statement of financial position — when legal title passes, or at some other time."
  new: "Seller delivers, but retains control. A seller may deliver goods to another party, such as a dealer or distributor for sale to an end customer, but retain control of them. Arrangements of this kind are common in certain industries, particularly the motor vehicle trade. The objective of both parties is to enable the dealer to sell as many units as possible; the dealer is often given incentives through bonus schemes so that the volume sold is as high as possible, and the consignment arrangement serves that objective. The manufacturer (or a financier) generally retains title until a predetermined event occurs. Physical transfer to the dealer usually precedes title transfer. Title tends to pass some time after physical transfer, generally on receipt of cleared funds (but not to the dealer if it has already sold the vehicle on). The key issue is the point at which the dealer has, in substance, acquired an asset to recognise in its statement of financial position — when legal title passes, or at some other time."
  source: "Accepted CHANGELOG-127 / BVN-127 (#127)"
- action: changed
  file: "ias-2/draft-v1-linked/ch05.html"
  locator: "s-5-1"
  old: "Reservation of title. Under a reservation-of-title clause the seller recognises the product as inventory — and the customer does not — until the customer has obtained control; passage of title is one of five indicators of control ( Chapter 2 · reservation of title). are dealt with outside PwC’s inventories chapter — in chapter 11 (paras 232 to 240) and chapter 40 of its manual."
  new: "Reservation of title. Under a reservation-of-title clause the seller recognises the product as inventory — and the customer does not — until the customer has obtained control; passage of title is one of five indicators of control. Full EX 25.46.2 densify: Chapter 2 · reservation of title."
  source: "Accepted CHANGELOG-127 / BVN-127 (#127)"
- action: changed
  file: "ias-2/draft-v1-linked/ch02.html"
  locator: "s-2-ex-rot"
  old: "The seller recognises the product as inventory — and the customer does not — until the customer has obtained control."
  new: "The seller should recognise the product as inventory, and the customer should not recognise the inventory, until the customer has obtained control of the product."
  source: "Accepted CHANGELOG-127 / BVN-127 (#127)"
- action: changed
  file: "ias-2/draft-v1-linked/ch02.html"
  locator: "s-2-ex-rot"
  old: "In some jurisdictions sellers commonly include reservation-of-title clauses so that they retain legal ownership of the goods until the purchaser has paid."
  new: "In some jurisdictions it is common for companies that sell goods to other companies to include reservation-of-title clauses in their contracts, so that the selling company retains legal ownership of those goods until the purchaser has paid for them."
  source: "Accepted CHANGELOG-127 / BVN-127 (#127)"
- action: changed
  file: "ias-2/draft-v1-linked/ch02.html"
  locator: "s-2-3"
  old: "The dealer pays for and adopts them"
