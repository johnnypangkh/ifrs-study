- action: changed
  file: "ias-2/draft-v1-linked/ch02.html"
  locator: "s-2-ex-rot"
  old: "Under IFRS 15 the sale is recognised when the purchaser obtains control; passage of title is one of five indicators, and the entity considers all of them."
  new: "Under IFRS 15, the sale of goods is recognised when the purchaser has obtained control of the product. Passage of title is one of five indicators that the customer has obtained control; entities determine whether control has passed by considering all of the indicators."
  source: "Accepted CHANGELOG-127 / BVN-127 (#127)"
- action: changed
  file: "ias-2/draft-v1-linked/ch02.html"
  locator: "s-2-ex-rot"
  old: "The main effect is to improve the unpaid seller’s position if the purchaser becomes insolvent, and whether an effective reservation exists depends on the construction of the particular contract."
