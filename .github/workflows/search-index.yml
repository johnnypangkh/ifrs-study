name: Publish checks

on:
  pull_request:
    paths:
      - "**/draft-v1-linked/**"
      - "_shared/**"
      - homepage/build-search-index.py
      - ias-16/**
      - tools/**
      - .github/workflows/search-index.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild map includes, stamps, search index, and last-update
        run: bash tools/build-all.sh
      - name: Fail if generated files drifted
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated files are stale. From the repo root, run bash tools/build-all.sh, then commit the result. CI does not commit."
            git diff --stat
            exit 1
          fi
      - name: Fail on duplicated plates or bad cache stamps
        run: python3 tools/check-duplicates.py
