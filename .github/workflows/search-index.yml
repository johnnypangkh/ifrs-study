name: Publish checks

on:
  pull_request:
    paths:
      - "**/draft-v1-linked/**"
      - "_shared/**"
      - homepage/build-search-index.py
      - tools/build-last-update.py
      - .github/workflows/search-index.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild search index
        run: python3 homepage/build-search-index.py
      - name: Rebuild last-update stamps
        run: python3 tools/build-last-update.py
      - name: Fail if the index or stamps drifted
        run: |
          if ! git diff --exit-code; then
            echo "::error::Search index or last-update stamps are stale. From the repo root, run python3 homepage/build-search-index.py and python3 tools/build-last-update.py, then commit the result. CI does not commit."
            git diff --stat
            exit 1
          fi
