name: Publish checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild map includes, stamps, search index, and last-update
        run: bash tools/build-all.sh
      - name: Fail if generated files drifted
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated files are stale. From the repo root, run bash tools/build-all.sh, then commit the result. CI does not commit."
            git diff --stat
            exit 1
          fi
      - name: Fail if chapter pages drift from source
        run: python3 tools/build-chapter.py --check
      - name: Fail on duplicated plates or bad cache stamps
        run: python3 tools/check-duplicates.py
      - name: Test incremental teaching diff
        run: python3 -m unittest discover -s tools/tests -v
      - name: Fail on unapproved teaching removals or changes
        run: python3 tools/check-incremental.py
      - name: Install openpyxl
        run: python3 -m pip install openpyxl==3.1.5
      - name: Check tokens.css matches MASTER-STYLES.xlsx
        run: python3 tools/xlsx_to_tokens.py --check
      - name: Check settings rows cover every token
        run: python3 tools/check-settings-rows.py
      - name: Check existing pages change only the stamp
        run: python3 tools/check-stamp-only.py
      - name: Map master Pick A lint
        run: python3 tools/map-lint.py
      - name: Map lint on the settings page
        run: python3 tools/xlsx_to_tokens.py --map-lint-settings
      - name: Map lint on shared CSS
        run: python3 tools/xlsx_to_tokens.py --map-lint-shared
      - name: Owned-token grep
        run: python3 tools/check-owned-tokens.py
      - name: Fail on new type literals
        run: python3 tools/check-type-literals.py
      - name: Owned-token check (report only)
        continue-on-error: true
        run: python3 tools/xlsx_to_tokens.py --owned | tee owned-token-report.txt
      - name: Verify main tokens against the workbook (report only)
        continue-on-error: true
        run: python3 tools/verify_pr1_tokens.py | tee verify-pr1-tokens.txt
      - name: Map lint (report only)
        continue-on-error: true
        run: python3 tools/xlsx_to_tokens.py --map-lint | tee map-lint-report.txt
      - name: Upload token reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr1-token-reports
          path: |
            owned-token-report.txt
            verify-pr1-tokens.txt
            map-lint-report.txt
          if-no-files-found: ignore
      - name: Upload incremental teaching report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: incremental-report
          path: incremental-report.csv
          if-no-files-found: ignore
